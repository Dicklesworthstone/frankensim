[package]
name = "fs-live-piano"
version = "0.0.1"
edition = "2024"
publish = false
description = "Live in-browser (WASM) concert-grand piano: the reduced real-time model. Same string/bridge/board equations and the same Model D instrument description as FrankenSim's offline grand_piano reference, restricted to the sounding keys. NOT the offline reference."

# Its own workspace (the fs-wasm / fs-flyer-wasm pattern): the browser binding
# is decoupled from the native workspace so a wasm build never depends on the
# state of unrelated in-progress crates.
[workspace]

[lib]
name = "fs_live_piano"
crate-type = ["cdylib", "rlib"]
# The library includes the reference example's source files; their own unit
# tests need the complete example tree, so this crate's tests live in tests/.
# `bench = false` too: a bench target would compile the library with cfg(test)
# (it did under `cargo check --all-targets`) and so pull those tests in.
test = false
doctest = false
bench = false

[package.metadata.frankensim]
layer = "L6"

[dependencies]
fs-couple = { path = "../../../crates/fs-couple" }
fs-material = { path = "../../../crates/fs-material" }
fs-matdb = { path = "../../../crates/fs-matdb" }
fs-qty = { path = "../../../crates/fs-qty" }
fs-math = { path = "../../../crates/fs-math" }
fs-modal = { path = "../../../crates/fs-modal" }
fs-plate = { path = "../../../crates/fs-plate" }
fs-la = { path = "../../../crates/fs-la" }
fs-nlmodal = { path = "../../../crates/fs-nlmodal" }
fs-phs = { path = "../../../crates/fs-phs" }

[dev-dependencies]
fs-blake3 = { path = "../../../crates/fs-blake3" }
fs-evidence = { path = "../../../crates/fs-evidence" }

# Native only: the complete reference engine (validation oracle) names fs-bem.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
fs-bem = { path = "../../../crates/fs-bem" }

# wasm-bindgen only enters the wasm32 build - native builds stay dependency-clean.
# The version is pinned to the installed wasm-bindgen CLI (0.2.128).
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.128"
# asupersync in browser mode + JS-backed entropy for wasm32 (the fs-exec cone).
asupersync = { path = "../../../../asupersync", default-features = false, features = ["wasm-browser-prod"] }
getrandom = { version = "0.4", features = ["wasm_js"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false

[lints.rust]
unsafe_code = "forbid"
