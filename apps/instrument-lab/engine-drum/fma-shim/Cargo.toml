[package]
name = "fs-live-fma"
version = "0.0.1"
edition = "2024"
publish = false
description = "wasm32-only: routes the compiler's scalar fused multiply-add libcall to the CPU's FMA through WebAssembly relaxed-simd when (and only when) a start-up probe proves the host fuses; otherwise the same correctly rounded software FMA as before. Results are bit-identical either way."

[lib]
name = "fs_live_fma"

[dependencies]
# Pure-Rust correctly rounded fma for hosts whose relaxed madd does not fuse.
libm = { version = "0.2.16", default-features = false }

# The single registered unsafe capsule of the live engines: one exported C
# symbol and one target-feature call. See SAFETY.md.
[lints.rust]
unsafe_code = "allow"
