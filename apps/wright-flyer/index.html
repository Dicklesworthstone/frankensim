<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>First Flight — Wright Flyer</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #0b0e12;
        color: #d8dce2;
        font-family: system-ui, sans-serif;
      }
      #app {
        position: fixed;
        inset: 0;
      }
      #capability-banner {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        padding: 4px 10px;
        font-size: 12px;
        background: rgba(10, 14, 20, 0.85);
        border-top: 1px solid #2a3140;
        display: flex;
        gap: 16px;
        justify-content: space-between;
        z-index: 10;
      }
      #capability-banner .warn {
        color: #e0b34d;
      }
      /* ---- game HUD: analog dial panel ---- */
      #wf-dial-panel {
        position: fixed;
        left: 50%;
        bottom: 26px;
        transform: translateX(-50%);
        display: flex;
        align-items: flex-end;
        gap: 10px;
        padding: 12px 18px 10px;
        border-radius: 14px 14px 6px 6px;
        background:
          linear-gradient(180deg, rgba(74, 50, 30, 0.92), rgba(46, 30, 17, 0.95));
        border: 1px solid #6b4a26;
        border-bottom-color: #241507;
        box-shadow: 0 6px 24px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 220, 160, 0.25);
        z-index: 6;
      }
      .wf-dial svg {
        display: block;
        filter: drop-shadow(0 2px 3px rgba(0, 0, 0, 0.45));
      }
      #wf-lever-stack {
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin-left: 8px;
        min-width: 170px;
      }
      .wf-lever-label {
        font: 9px Georgia, serif;
        letter-spacing: 1.5px;
        color: #d9c294;
        margin-bottom: 3px;
      }
      .wf-lever-track {
        position: relative;
        height: 10px;
        border-radius: 5px;
        background: linear-gradient(180deg, #1d1207, #3a2713);
        border: 1px solid #6b4a26;
      }
      .wf-lever-center {
        position: absolute;
        left: 50%;
        top: -2px;
        bottom: -2px;
        width: 1px;
        background: rgba(217, 194, 148, 0.6);
      }
      .wf-lever-pointer {
        position: absolute;
        top: -3px;
        width: 6px;
        height: 14px;
        margin-left: -3px;
        border-radius: 2px;
        background: #e8c76a;
        box-shadow: 0 0 4px rgba(232, 199, 106, 0.7);
        transition: left 60ms linear;
      }
      .wf-lever-pointer.at-stop {
        background: #d4553a;
        box-shadow: 0 0 6px rgba(212, 85, 58, 0.9);
      }
      .wf-lever-value {
        font: 10px monospace;
        color: #f0e4c8;
        margin-top: 2px;
      }
      /* ---- phase banner ---- */
      #wf-phase-banner {
        position: fixed;
        top: 34px;
        left: 50%;
        transform: translateX(-50%);
        padding: 8px 26px;
        font: 700 18px/1.3 Georgia, serif;
        letter-spacing: 3px;
        color: #f3e9d2;
        background: rgba(32, 22, 12, 0.82);
        border: 1px solid #b08d3f;
        border-radius: 4px;
        text-align: center;
        max-width: 80vw;
        z-index: 7;
      }
      #wf-phase-banner[data-tone="good"] {
        color: #cfe8b8;
        border-color: #7ea35c;
      }
      #wf-phase-banner[data-tone="end"] {
        color: #f3c9b0;
        border-color: #a4321f;
        background: rgba(52, 18, 8, 0.88);
      }
      .wf-banner-pop {
        animation: wf-pop 380ms ease-out;
      }
      @keyframes wf-pop {
        0% {
          transform: translateX(-50%) scale(1.25);
          opacity: 0;
        }
        100% {
          transform: translateX(-50%) scale(1);
          opacity: 1;
        }
      }
      /* ---- results card (period telegram) ---- */
      #wf-results-card {
        position: fixed;
        right: 14px;
        top: 64px;
        font: 12px/1.55 "Courier New", monospace;
        color: #2a2013;
        background:
          linear-gradient(180deg, #f4ead0, #eddfbc);
        border: 1px solid #b8a06c;
        border-radius: 3px;
        padding: 14px 16px;
        max-width: 46ch;
        box-shadow: 0 8px 22px rgba(0, 0, 0, 0.45);
        z-index: 8;
      }
      /* ---- landing menu ---- */
      .wf-card-in {
        animation: wf-card-in 620ms cubic-bezier(0.16, 0.84, 0.32, 1) both;
      }
      @keyframes wf-card-in {
        0% {
          transform: translateX(26px) rotate(1.2deg);
          opacity: 0;
        }
        100% {
          transform: translateX(0) rotate(-0.4deg);
          opacity: 1;
        }
      }
      #wf-menu {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(10, 8, 5, 0.55);
        backdrop-filter: blur(2px);
        z-index: 20;
      }
      #wf-menu-card {
        width: min(680px, 92vw);
        padding: 30px 34px 22px;
        border-radius: 10px;
        background: linear-gradient(180deg, rgba(58, 40, 24, 0.96), rgba(36, 24, 13, 0.97));
        border: 1px solid #8a6a38;
        box-shadow: 0 14px 44px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 224, 170, 0.25);
        text-align: center;
      }
      #wf-menu-title {
        font: 700 40px/1.1 Georgia, serif;
        letter-spacing: 8px;
        color: #eed9a4;
        text-shadow: 0 2px 6px rgba(0, 0, 0, 0.6);
      }
      #wf-menu-sub {
        font: 13px Georgia, serif;
        color: #c9b183;
        margin: 6px 0 20px;
      }
      .wf-menu-row {
        display: flex;
        gap: 10px;
        margin-bottom: 12px;
      }
      .wf-mode-btn {
        flex: 1;
        padding: 12px 10px;
        border-radius: 6px;
        border: 1px solid #6b4a26;
        background: rgba(24, 16, 8, 0.7);
        color: #e8d9b4;
        cursor: pointer;
        font: 12px Georgia, serif;
      }
      .wf-mode-btn b {
        display: block;
        letter-spacing: 1.5px;
        margin-bottom: 5px;
        color: #eed9a4;
      }
      .wf-mode-btn span {
        font-size: 11px;
        color: #bda87e;
        line-height: 1.4;
      }
      .wf-mode-btn.selected,
      .wf-opt-btn.selected {
        border-color: #e8c76a;
        box-shadow: 0 0 8px rgba(232, 199, 106, 0.4);
        background: rgba(60, 42, 20, 0.9);
      }
      .wf-opt-btn {
        flex: 1;
        padding: 8px 10px;
        border-radius: 6px;
        border: 1px solid #6b4a26;
        background: rgba(24, 16, 8, 0.7);
        color: #d9c294;
        cursor: pointer;
        font: 11px Georgia, serif;
        letter-spacing: 1px;
      }
      .wf-opt-btn:disabled {
        opacity: 0.4;
        cursor: default;
      }
      #wf-go-btn {
        width: 100%;
        padding: 14px;
        margin: 6px 0 14px;
        border-radius: 6px;
        border: 1px solid #b08d3f;
        background: linear-gradient(180deg, #b08d3f, #8a6a2c);
        color: #241807;
        font: 700 16px Georgia, serif;
        letter-spacing: 3px;
        cursor: pointer;
      }
      #wf-go-btn:hover {
        filter: brightness(1.1);
      }
      #wf-menu-keys {
        font: 11px/1.7 monospace;
        color: #bda87e;
        text-align: center;
        margin: 0 0 10px;
      }
      #wf-demo-link {
        font: 11px Georgia, serif;
        color: #9d8a64;
      }
      @media (max-width: 900px) {
        #wf-dial-panel {
          transform: translateX(-50%) scale(0.72);
          transform-origin: bottom center;
        }
        .wf-menu-row {
          flex-direction: column;
        }
      }
      /* ---- guided journey overlay ---- */
      #wf-journey {
        position: fixed;
        left: 50%;
        bottom: 118px;
        transform: translateX(-50%);
        max-width: 76vw;
        text-align: center;
        z-index: 9;
        pointer-events: none;
      }
      .wf-journey-caption {
        font: 13px Georgia, serif;
        color: #e8dcbf;
        background: rgba(32, 22, 12, 0.78);
        border: 1px solid #8a6a38;
        border-radius: 6px;
        padding: 8px 14px;
        line-height: 1.5;
      }
      .wf-journey-next {
        margin-top: 6px;
        font: 700 13px Georgia, serif;
        letter-spacing: 1px;
      }
      .wf-journey-next a {
        color: #eed9a4;
        pointer-events: auto;
      }
      /* ---- photo mode (body class, presentation-only grade) ---- */
      body.wf-photo #wf-telemetry,
      body.wf-photo #wf-dial-panel,
      body.wf-photo #wf-phase-banner,
      body.wf-photo #wf-results-card,
      body.wf-photo #wf-journey,
      body.wf-photo #capability-banner,
      body.wf-photo #wf-qos-badge {
        display: none !important;
      }
      body.wf-photo #app canvas {
        filter: sepia(0.55) contrast(1.06) brightness(1.02) saturate(0.85);
      }
      body.wf-photo::after {
        content: "";
        position: fixed;
        inset: 10px;
        border: 2px solid rgba(243, 233, 210, 0.85);
        box-shadow: inset 0 0 60px rgba(20, 14, 6, 0.35);
        pointer-events: none;
        z-index: 30;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="capability-banner">
      <span id="capability-text">probing capabilities…</span>
      <span id="fps-text">— fps</span>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
