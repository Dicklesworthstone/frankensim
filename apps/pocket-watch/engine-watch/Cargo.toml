[package]
name = "fs-pocket-watch"
version = "0.1.0"
edition = "2024"
publish = false
description = "FrankenSim tourbillon pocket watch: a contact-dynamics Swiss lever escapement and going train driven by a mainspring, coupled to an enthalpy heat/phase-change field with liquid gold and oil films, LN2 boiling, an NdFeB magnet and hairspring hysteresis, and modal acoustics rung by the escapement impacts."

[workspace]

[lib]
name = "fs_pocket_watch"
crate-type = ["cdylib", "rlib"]

[package.metadata.frankensim]
layer = "L6"

[dependencies]
fs-blake3 = { path = "../../../crates/fs-blake3" }
fs-math = { path = "../../../crates/fs-math" }
fs-qty = { path = "../../../crates/fs-qty" }
fs-material = { path = "../../../crates/fs-material" }
fs-thermochem = { path = "../../../crates/fs-thermochem" }
fs-convection = { path = "../../../crates/fs-convection" }
fs-plate = { path = "../../../crates/fs-plate" }
fs-vkplate = { path = "../../../crates/fs-vkplate" }
fs-tribo = { path = "../../../crates/fs-tribo" }
fs-contact = { path = "../../../crates/fs-contact" }
fs-modal = { path = "../../../crates/fs-modal" }
fs-duct = { path = "../../../crates/fs-duct" }
fs-aeroac = { path = "../../../crates/fs-aeroac" }
fs-psycho = { path = "../../../crates/fs-psycho" }
fs-eproc = { path = "../../../crates/fs-eproc" }
fs-render = { path = "../../../crates/fs-render", features = ["tracer", "photometry"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.128"
asupersync = { path = "../../../../asupersync", default-features = false, features = ["wasm-browser-prod"] }
getrandom = { version = "0.4", features = ["wasm_js"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false

[lints.rust]
unsafe_code = "forbid"
