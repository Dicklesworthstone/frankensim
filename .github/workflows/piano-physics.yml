name: Native piano and SDK verification
on:
  push:
    branches: [validate/piano-native-897fbf13]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 897fbf13c764ccb3cdbc513ffd0b8a66d86a61ad
          persist-credentials: false
      - name: Materialize the repository's pinned dependencies
        run: |
          if ! cargo run --manifest-path tools/bootstrap/Cargo.toml; then
            # Keep the exact tracked bytes AND disable Git's contradictory
            # clean-side EOL conversion for this one legacy batch file.
            # Dependency versions and bootstrap verification remain unchanged.
            python3 - <<'PY'
          import pathlib, subprocess
          root = pathlib.Path('../franken_numpy')
          path = 'legacy_numpy_code/numpy/doc/make.bat'
          git_dir = subprocess.check_output(['git', '-C', str(root), 'rev-parse', '--absolute-git-dir'], text=True).strip()
          attributes = pathlib.Path(git_dir) / 'info/attributes'
          attributes.parent.mkdir(parents=True, exist_ok=True)
          with attributes.open('a') as f:
              f.write('\n' + path + ' -text\n')
          blob = subprocess.check_output(['git', '-C', str(root), 'show', 'HEAD:' + path])
          (root / path).write_bytes(blob)
          PY
            cargo run --manifest-path tools/bootstrap/Cargo.toml -- --offline
          fi
      - name: Compile the two native piano examples
        run: cargo test --locked -p fs-couple --example grand_piano --example piano_exterior --no-run
      - name: Check directional microphones and multi-channel performance
        run: |
          cargo test --locked -p fs-couple --example grand_piano cardioid -- --test-threads=1
          cargo test --locked -p fs-couple --example grand_piano directional_microphones -- --test-threads=1
          cargo test --locked -p fs-couple --example grand_piano midi -- --test-threads=1
          cargo test --locked -p fs-couple --example piano_exterior midi -- --test-threads=1
      - name: Check passive soundboard loading
        run: |
          cargo test --locked -p fs-couple --example grand_piano rayleigh_loading -- --test-threads=1
          cargo test --locked -p fs-couple --example piano_exterior radiation_port -- --test-threads=1
          cargo test --locked -p fs-couple --lib render::plate::impact::radiation::fit -- --test-threads=1
      - name: Test Python studies against the native executable
        run: |
          cargo build --locked -p fs-cli
          PYTHONPATH=python:python/tests python3 -m unittest -v test_client.TestFrankenSimClientIntegration.test_thermal_study_budget_stop_then_resume_from_ledger test_client.TestFrankenSimClientIntegration.test_study_admission_failure_has_no_retained_run
