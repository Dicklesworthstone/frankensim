name: Physics Newton
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  physical-hessians:
    if: contains(github.event.head_commit.message, '[physics-newton]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Materialize pinned dependencies
        run: cargo run --manifest-path tools/bootstrap/Cargo.toml
      - name: Test native structural compliance Hessians
        if: ${{ !cancelled() }}
        run: cargo test --release -p fs-topopt --test compliance_hessian
      - name: Test live IR physics composition and retained first-order behavior
        if: ${{ !cancelled() }}
        run: cargo test --release -p fs-opt --test augmented_lagrangian --test physics_hessian --test physics_bindings --test hessian_products
      - name: Test native thermal second-order adjoints
        if: ${{ !cancelled() }}
        run: cargo test --release -p fs-conduction --test conductivity_hessian
      - name: Test real thermal Newton and retained optimizer integrations
        if: ${{ !cancelled() }}
        run: cargo test --release -p fs-ascent --features conduction-design --test augmented_newton --test conductivity_newton --test reverse_newton --test constrained_conductivity
      - name: Run the physical conductivity design example
        if: ${{ !cancelled() }}
        run: cargo run --release -p fs-ascent --features conduction-design --example conductivity_newton
      - name: Run the constrained native conductivity design
        if: ${{ !cancelled() }}
        run: cargo run --release -p fs-ascent --features conduction-design --example constrained_conductivity
