name: Factor assimilation
on:
  push:
    branches: [main]
    paths:
      - 'crates/fs-assimilate/**'
      - 'crates/fs-oed-e2e/**'
      - '.github/workflows/factor-assimilation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  factor-batches:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Materialize pinned dependencies
        run: |
          if ! cargo run --manifest-path tools/bootstrap/Cargo.toml; then
            # Restore only the known line-ending-only discrepancy in this
            # fresh incomplete clone, preserving the lock, source and index.
            python3 - <<'PYCODE'
          import json, pathlib, subprocess
          root = pathlib.Path('../franken_numpy')
          pin = next(r for r in json.loads(pathlib.Path('constellation.lock').read_text())['libraries'] if r['lib'] == 'franken_numpy')['git_head']
          def git(*args):
              return subprocess.check_output(['git', '-C', str(root), *args])
          if git('rev-parse', 'HEAD').decode().strip() != pin or git('config', '--local', '--get', 'frankensim.bootstrapIncomplete').strip() != b'true':
              raise SystemExit('not the incomplete pinned clone; refusing repair')
          name = 'legacy_numpy_code/numpy/doc/make.bat'
          path = root / name
          if path.is_symlink() or not path.is_file():
              raise SystemExit('expected an ordinary tracked batch file')
          raw = git('cat-file', 'blob', pin + ':' + name)
          actual = path.read_bytes()
          if actual == raw or actual.replace(b'\r\n', b'\n') != raw.replace(b'\r\n', b'\n'):
              raise SystemExit('not a line-ending-only checkout discrepancy')
          attributes = pathlib.Path(git('rev-parse', '--absolute-git-dir').decode().strip()) / 'info/attributes'
          attributes.parent.mkdir(parents=True, exist_ok=True)
          with attributes.open('a') as stream:
              stream.write('\n' + name + ' -text\n')
          path.write_bytes(raw)
          git('add', '--', name)
          if git('rev-parse', ':' + name).strip() != git('rev-parse', pin + ':' + name).strip() or path.read_bytes() != raw:
              raise SystemExit('restoration changed the locked source or index')
          PYCODE
            cargo run --manifest-path tools/bootstrap/Cargo.toml -- --offline
          fi
      - name: Test the actual crate, factor kernels, and correlated batches
        run: cargo test -p fs-assimilate --test factor --test factor_forecast --test robust --test factor_batch --test shared_noise --test shared_design --example shared_calibration
      - name: Test outcome-free SensorForge measurement studies
        run: cargo test -p fs-oed-e2e --test measurement --test seeded_acquisition --example measured_sensorforge
      - name: Run calibration and joint acquisition examples
        run: |
          cargo run -p fs-assimilate --example shared_calibration
          cargo run -p fs-assimilate --example shared_stream
          cargo run -p fs-assimilate --example shared_batch_design
          cargo run -p fs-assimilate --example shared_batch_design -- 3.2 0.9
          printf 'A 10.1 synthetic-meter\nB 10.2 synthetic-meter\n' | cargo run -p fs-oed-e2e --example measured_sensorforge
