name: Thermal flux bounds
on:
  push:
    branches: [main]
    paths:
      - 'crates/fs-verify/**'
      - 'crates/fs-conduction/**'
      - 'crates/fs-solver/**'
      - 'crates/fs-cli/src/network_command/transient/**'
      - '.github/workflows/thermal-bounds.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tetrahedral-flux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compile and test original dependency-free numerical modules
        run: |
          scratch=$(mktemp -d)
          sed '/^#\[cfg(test)\]/,$d' crates/fs-verify/src/interval.rs > "$scratch/interval.rs"
          cp crates/fs-verify/src/tet.rs "$scratch/tet.rs"
          cp -r crates/fs-verify/src/tet "$scratch/tet"
          printf '#![forbid(unsafe_code)]\npub mod interval;\npub mod tet;\n' > "$scratch/check.rs"
          rustc --edition=2024 --test -O "$scratch/check.rs" -o "$scratch/flux-tests"
          "$scratch/flux-tests"
      - name: Materialize pinned dependencies
        run: |
          if ! cargo run --manifest-path tools/bootstrap/Cargo.toml; then
            # The pinned NumPy .bat checks out with different line endings.
            # Restore ONLY this known blob in the fresh CI sibling, then rerun
            # all original pin/cleanliness checks. No verifier is bypassed.
            file=legacy_numpy_code/numpy/doc/make.bat
            expected=bf42cca10b732e4277a3737f605b00d30b82b69c
            test "$(git -C ../franken_numpy rev-parse "HEAD:$file")" = "$expected"
            git -C ../franken_numpy cat-file blob "$expected" > "../franken_numpy/$file"
            cargo run --manifest-path tools/bootstrap/Cargo.toml
          fi
      - name: Test checked CG and immutable-history cooling
        run: |
          cargo test --release -p fs-solver --lib checked_cg::
          cargo test --release -p fs-conduction --lib transient::backward_euler::tests
      - name: Test actual transient fan-sizing trajectories
        run: cargo test --release -p fs-cli --lib network_command::transient::sizing::tests
      - name: Test tetrahedral energy and goal bounds in the workspace
        run: |
          cargo test --release -p fs-verify --features certified-speculation --lib tet::
      - name: Test real conduction primal and dual consumers
        run: |
          cargo test --release -p fs-verify --features thermal-conduction --lib conduction::
      - name: Execute mean-temperature comparison
        run: cargo run --release -p fs-verify --features thermal-conduction --example conduction_mean -- 4 2.0
