name: Thermal flux bounds
on:
  push:
    branches: [main]
    paths:
      - 'crates/fs-verify/**'
      - 'crates/fs-conduction/**'
      - 'crates/fs-solver/**'
      - 'crates/fs-cli/src/network_command/transient/**'
      - 'crates/fs-cli/src/solve/transient/**'
      - 'crates/fs-cli/tests/solve/transient_enthalpy*'
      - 'crates/fs-cli/tests/solve/transient_enthalpy_adjoint/**'
      - '.github/workflows/thermal-bounds.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tetrahedral-flux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compile and test original dependency-free numerical modules
        run: |
          scratch=$(mktemp -d)
          sed '/^#\[cfg(test)\]/,$d' crates/fs-verify/src/interval.rs > "$scratch/interval.rs"
          cp crates/fs-verify/src/tet.rs "$scratch/tet.rs"
          cp -r crates/fs-verify/src/tet "$scratch/tet"
          cp crates/fs-verify/tests/affine_source.rs "$scratch/affine_source.rs"
          cp crates/fs-verify/tests/contact_bounds.rs "$scratch/contact_bounds.rs"
          cp crates/fs-verify/tests/region_mean.rs "$scratch/region_mean.rs"
          printf '#![forbid(unsafe_code)]\nextern crate self as fs_verify;\npub mod interval;\npub mod tet;\nmod affine_source;\nmod contact_bounds;\nmod region_mean;\n' > "$scratch/check.rs"
          rustc --edition=2024 --cfg 'feature="certified-speculation"' --test -O "$scratch/check.rs" -o "$scratch/flux-tests"
          "$scratch/flux-tests"
      - name: Materialize pinned dependencies
        run: |
          if ! cargo run --manifest-path tools/bootstrap/Cargo.toml; then
            # Repair only the known line-ending transformation in the fresh,
            # still-marked pinned clone. Keep raw bytes AND the index unchanged
            # by Git's text filters; git-add would normalize the index instead.
            python3 - <<'PY'
          import json, pathlib, stat, subprocess
          root = pathlib.Path('../franken_numpy')
          name = 'legacy_numpy_code/numpy/doc/make.bat'
          expected = 'bf42cca10b732e4277a3737f605b00d30b82b69c'
          def git(*args):
              return subprocess.check_output(['git', '-C', str(root), *args])
          pin = next(r['git_head'] for r in json.loads(pathlib.Path('constellation.lock').read_text())['libraries'] if r['lib'] == 'franken_numpy')
          if git('rev-parse', 'HEAD').decode().strip() != pin or git('config', '--local', '--get', 'frankensim.bootstrapIncomplete').strip() != b'true':
              raise SystemExit('not the incomplete pinned NumPy checkout')
          if git('rev-parse', 'HEAD:' + name).decode().strip() != expected or git('rev-parse', ':' + name).decode().strip() != expected:
              raise SystemExit('unexpected committed or staged source; refusing repair')
          for path in [root, root / '.git', *(root / name).parents][:-1]:
              if path.is_symlink() or not path.is_dir():
                  raise SystemExit('redirected or non-directory source path')
          path = root / name
          if not stat.S_ISREG(path.lstat().st_mode):
              raise SystemExit('expected an ordinary tracked source file')
          raw = git('cat-file', 'blob', expected)
          actual = path.read_bytes()
          if actual.replace(b'\r\n', b'\n') != raw.replace(b'\r\n', b'\n'):
              raise SystemExit('not a line-ending-only discrepancy; refusing repair')
          info = root / '.git' / 'info'
          if info.is_symlink() or (info.exists() and not info.is_dir()):
              raise SystemExit('invalid Git info directory')
          info.mkdir(exist_ok=True)
          with (info / 'attributes').open('x') as attributes:
              attributes.write(name + ' -text -filter -ident -working-tree-encoding\n')
          path.write_bytes(raw)
          if path.read_bytes() != raw or git('rev-parse', ':' + name).decode().strip() != expected:
              raise SystemExit('repair changed the pinned source or index')
          if git('status', '--porcelain=v1', '--untracked-files=no', '--', name).strip():
              raise SystemExit('exact-source repair did not clear the checkout discrepancy')
          PY
            cargo run --manifest-path tools/bootstrap/Cargo.toml
          fi
      - name: Test prescribed-temperature enthalpy physics and trajectories
        run: cargo test --release -p fs-conduction --test enthalpy_adjoint --test enthalpy_transport --test enthalpy_radiation --test heterogeneous_enthalpy --test thermal_history_enthalpy -- --test-threads=1
      - name: Test native enthalpy storage, bath reactions and controls
        run: cargo test --release -p fs-cli --test solve transient_enthalpy -- --test-threads=1
      - name: Test checked CG and immutable-history cooling
        run: |
          cargo test --release -p fs-solver --lib checked_cg::
          cargo test --release -p fs-conduction --lib transient::backward_euler::tests
      - name: Test actual transient fan-sizing trajectories
        run: cargo test --release -p fs-cli --bin frankensim network_command::transient::sizing::tests
      - name: Test tetrahedral energy and goal bounds in the workspace
        run: |
          cargo test --release -p fs-verify --features certified-speculation --lib tet::
          cargo test --release -p fs-verify --features certified-speculation --test affine_source --test contact_bounds --test region_mean
      - name: Test real conduction primal and dual consumers
        run: |
          cargo test --release -p fs-verify --features thermal-conduction --lib conduction::
          cargo test --release -p fs-conduction --features thermal-verification --test contact_mean_bound --test region_mean_bound
      - name: Execute mean-temperature comparison
        run: |
          cargo run --release -p fs-verify --features thermal-conduction --example conduction_mean -- 4 2.0
          cargo run --release -p fs-verify --features thermal-conduction --example conduction_mean -- --affine 4 0.0 24.0 4.0 2.0 1.0
