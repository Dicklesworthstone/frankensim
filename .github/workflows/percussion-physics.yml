name: Percussion physics
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  percussion:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[percussion-check]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Retain the exact mechanical source for failure reproduction
        run: >-
          git archive --format=tar.gz -o percussion-source.tar.gz HEAD
          crates/fs-phs crates/fs-couple crates/fs-plate crates/fs-material
          crates/fs-dcontact crates/fs-la .beads/issues.jsonl
          COMPREHENSIVE_PLAN_FOR_FRANKENSIM.md
          COMPREHENSIVE_PLAN_FOR_OPTIMAL_MUSIC_ORIENTED_BUILDING_BLOCKS.md
      - uses: actions/upload-artifact@v4
        with:
          name: percussion-source
          path: percussion-source.tar.gz
          retention-days: 3
      - name: Materialize the repository's pinned dependencies
        run: cargo run --manifest-path tools/bootstrap/Cargo.toml
      # Keep provenance failures red, but report actual compiler/test results
      # independently. A legacy NumPy .bat EOL check must not hide these results.
      - name: Test curved-shell motion and nonlinear reduction
        if: ${{ !cancelled() }}
        run: set -o pipefail; cargo test --release -p fs-plate --test shell_reduction --test percussion_shell 2>&1 | tee percussion-shell.log
      - name: Test the nonlinear time owner
        if: ${{ !cancelled() }}
        run: set -o pipefail; cargo test --release -p fs-phs --lib --test prepared_step --test phs 2>&1 | tee percussion-phs.log
      - name: Test nonlinear percussion, material history and mixed playback
        if: ${{ !cancelled() }}
        run: set -o pipefail; cargo test --release -p fs-couple --test prepared_impact --test percussion_impact --test membrane_impact --test modal_cavity_impact --test cylindrical_cavity --test bowed_ensemble --test ensemble_render --test modal_friction --test pressure_ensemble 2>&1 | tee percussion-mechanics.log
      - name: Test file-driven physical ensemble rendering
        if: ${{ !cancelled() }}
        run: set -o pipefail; cargo test --release -p fs-couple --bin music_render --test music_render_ensemble --test bowed_file 2>&1 | tee percussion-ensemble-cli.log
      - name: Test prepared cavity, physical pressure and PCM consumers
        if: ${{ !cancelled() }}
        run: >-
          set -o pipefail; cargo test --release -p fs-couple --lib render::plate::impact:: 2>&1 | tee percussion-audio.log
      - name: Test the actual percussion construction
        if: ${{ !cancelled() }}
        run: set -o pipefail; cargo test --release -p fs-couple --example percussion -- --test-threads=1 2>&1 | tee percussion-example.log
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: percussion-test-output
          path: percussion-*.log
          retention-days: 3
