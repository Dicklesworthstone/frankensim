name: Percussion physics
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  percussion:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[percussion-check]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Retain the exact mechanical source for failure reproduction
        run: >-
          git archive --format=tar.gz -o percussion-source.tar.gz HEAD
          crates/fs-phs crates/fs-couple crates/fs-plate crates/fs-material crates/fs-bem
          crates/fs-dcontact crates/fs-la crates/fs-flux crates/fs-tribo .beads/issues.jsonl
          COMPREHENSIVE_PLAN_FOR_FRANKENSIM.md
          COMPREHENSIVE_PLAN_FOR_OPTIMAL_MUSIC_ORIENTED_BUILDING_BLOCKS.md
      - uses: actions/upload-artifact@v4
        with:
          name: percussion-source
          path: percussion-source.tar.gz
          retention-days: 3
      - name: Test the dependency-free Reynolds pressure and gas-storage kernels
        run: |
          printf '#[path = "%s/crates/fs-tribo/src"] mod owner { pub mod resistive_film; }\nuse owner::resistive_film::*;\n#[path = "%s/crates/fs-flux/src/gas_film/resistive/tests.rs"] mod tests;\n' "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE" > "$RUNNER_TEMP/film-tests.rs"
          rustc --edition=2024 --test "$RUNNER_TEMP/film-tests.rs" -o "$RUNNER_TEMP/film-tests"
          "$RUNNER_TEMP/film-tests"
      - name: Materialize the repository's pinned dependencies
        if: ${{ !cancelled() }}
        run: cargo run --manifest-path tools/bootstrap/Cargo.toml
      # Keep provenance failures red, but report actual compiler/test results
      # independently. A legacy NumPy .bat EOL check must not hide these results.
      - name: Test reciprocal acoustic work and outgoing pressure
        if: ${{ !cancelled() }}
        run: set -o pipefail; cargo test --release -p fs-bem --lib reciprocal_radiation 2>&1 | tee percussion-reciprocal.log
      - name: Test curved-shell motion and nonlinear reduction
        if: ${{ !cancelled() }}
        run: set -o pipefail; cargo test --release -p fs-plate --lib --test shell_reduction --test percussion_shell 2>&1 | tee percussion-shell.log
      - name: Test the nonlinear time owner
        if: ${{ !cancelled() }}
        run: set -o pipefail; cargo test --release -p fs-phs --lib --test prepared_step --test phs 2>&1 | tee percussion-phs.log
      - name: Test distributed aperture contact and spatial slit flow
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          cargo test --release -p fs-dcontact --lib opening 2>&1 | tee percussion-aperture-contact.log
          cargo test --release -p fs-couple --lib bernoulli_aperture::plate::closure 2>&1 | tee percussion-aperture-flow.log
          cargo test --release -p fs-couple --lib pcm_wav::baffled 2>&1 | tee percussion-baffled-pressure.log
      - name: Test nonlinear percussion, material history and mixed playback
        if: ${{ !cancelled() }}
        run: set -o pipefail; cargo test --release -p fs-couple --test prepared_impact --test percussion_impact --test membrane_impact --test modal_cavity_impact --test cylindrical_cavity --test bowed_ensemble --test ensemble_render --test modal_friction --test pressure_ensemble --test plate_aperture --test dynamic_aperture --test aperture_tube --example plate_aperture 2>&1 | tee percussion-mechanics.log
      - name: Test file-driven physical ensemble rendering
        if: ${{ !cancelled() }}
        run: set -o pipefail; cargo test --release -p fs-couple --bin music_render --test music_render_ensemble --test bowed_file --test reed_performance --test music_render_wind 2>&1 | tee percussion-ensemble-cli.log
      - name: Test prepared cavity, physical pressure and PCM consumers
        if: ${{ !cancelled() }}
        run: >-
          set -o pipefail; cargo test --release -p fs-couple --lib render::plate::impact:: 2>&1 | tee percussion-audio.log
      - name: Test profile-driven kettle and coupled exterior pressure
        if: ${{ !cancelled() }}
        run: set -o pipefail; cargo test --release -p fs-couple --example kettle -- --test-threads=1 2>&1 | tee percussion-kettle.log
      - name: Test the actual percussion construction
        if: ${{ !cancelled() }}
        run: set -o pipefail; cargo test --release -p fs-couple --example percussion -- --test-threads=1 2>&1 | tee percussion-example.log
      - name: Render the reference drum in a non-default declared gas
        if: ${{ !cancelled() }}
        # The air is data: only --gas-record changes, and the sound must change with it.
        run: |
          set -o pipefail
          cargo run --release -q -p fs-couple --example percussion -- drum-wav 2400 2.0 > drum-reference-air.wav 2> percussion-gas-air.log
          cargo run --release -q -p fs-couple --example percussion -- --gas-record crates/fs-couple/examples/co2-20c.gas drum-wav 2400 2.0 > drum-co2.wav 2> percussion-gas-co2.log
          grep -q "ambient: --gas-record" percussion-gas-co2.log
          ! cmp -s drum-reference-air.wav drum-co2.wav
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: percussion-test-output
          path: percussion-*.log
          retention-days: 3
