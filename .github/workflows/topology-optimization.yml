name: Topology optimization
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  projected-stress:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[topology-check]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The consumer build was killed with concurrent large Rust compilations.
      # Keep the release profile unchanged; bound compiler concurrency instead.
      CARGO_BUILD_JOBS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Materialize pinned dependencies
        run: cargo run --manifest-path tools/bootstrap/Cargo.toml
      - name: Test same-material and stress-constrained descent
        if: ${{ !cancelled() }}
        run: set -o pipefail; cargo test --release -p fs-topols --lib projected 2>&1 | tee topology-tests.log
      - name: Test existing projected consumers
        if: ${{ !cancelled() }}
        run: set -o pipefail; cargo test --release -p fs-marquee --bin fs-marquee-elasticity-stress --test projected_resume --test design_regions --test projected_stress 2>&1 | tee topology-consumers.log
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: topology-test-output
          path: topology-*.log
          retention-days: 3
  reaction-response:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[reaction-check]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Materialize pinned dependencies
        run: cargo run --manifest-path tools/bootstrap/Cargo.toml
      - name: Test embedded reaction physics
        if: ${{ !cancelled() }}
        run: cargo test --release -p fs-cutfem --test embedded_reaction3
      - name: Test affine reaction and prescribed-motion goals
        if: ${{ !cancelled() }}
        run: cargo test --release -p fs-dwr --test reaction_goal3 --test motion_goal3
      - name: Test force and displacement response fitting
        if: ${{ !cancelled() }}
        run: cargo test --release -p fs-topopt --features cutfem-marquee --test reaction_response_sdf3 --test response_sdf3 --test projected_response_sdf3 --test response_goal3 --example reaction_response_sdf3
  native-study:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[native-study-check]')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Materialize pinned dependencies
        run: cargo run --manifest-path tools/bootstrap/Cargo.toml
      - name: Test native elasticity studies and constrained continuation
        if: ${{ !cancelled() }}
        run: cargo test --release -p fs-cli --lib study::elasticity
      - name: Test native study, resume and retained report commands
        if: ${{ !cancelled() }}
        run: cargo test --release -p fs-cli --test study_checkpoint_cli
