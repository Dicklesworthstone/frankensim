name: Topology optimization
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  projected-stress:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[topology-check]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The consumer build was killed with concurrent large Rust compilations.
      # Keep the release profile unchanged; bound compiler concurrency instead.
      CARGO_BUILD_JOBS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Materialize pinned dependencies
        run: cargo run --manifest-path tools/bootstrap/Cargo.toml
      - name: Test constructive 3D geometry and certified crossings
        if: ${{ !cancelled() }}
        run: set -o pipefail; cargo test --release -p fs-cutfem --lib csg3 2>&1 | tee topology-csg3.log
      - name: Test same-material and stress-constrained descent
        if: ${{ !cancelled() }}
        run: set -o pipefail; cargo test --release -p fs-topols --lib projected 2>&1 | tee topology-tests.log
      - name: Test existing projected consumers
        if: ${{ !cancelled() }}
        run: set -o pipefail; cargo test --release -p fs-marquee --bin fs-marquee-elasticity --bin fs-marquee-elasticity-stress --test projected_resume --test design_regions --test projected_stress 2>&1 | tee topology-consumers.log
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: topology-test-output
          path: topology-*.log
          retention-days: 3
  reaction-response:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[reaction-check]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Materialize pinned dependencies
        run: cargo run --manifest-path tools/bootstrap/Cargo.toml
      - name: Test response recovery and retained feasible designs
        if: ${{ !cancelled() }}
        run: cargo test --release -p fs-topopt --features cutfem-marquee --test response_checkpoint_sdf3
      - name: Test embedded reaction physics
        if: ${{ !cancelled() }}
        run: cargo test --release -p fs-cutfem --test embedded_reaction3
      - name: Test affine reaction and prescribed-motion goals
        if: ${{ !cancelled() }}
        run: cargo test --release -p fs-dwr --test reaction_goal3 --test motion_goal3
      - name: Test force and displacement response fitting
        if: ${{ !cancelled() }}
        run: cargo test --release -p fs-topopt --features cutfem-marquee --test reaction_response_sdf3 --test response_sdf3 --test projected_response_sdf3 --test response_goal3 --test response_limits_sdf3 --test binary_response_sdf3 --example reaction_response_sdf3 --example minimum_material_sdf3
  native-study:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[native-study-check]')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Materialize pinned dependencies
        run: |
          set -o pipefail
          cargo run --manifest-path tools/bootstrap/Cargo.toml 2>&1 | tail -n 30
      - name: Test fixed physical regions and adaptive checkpoint boundaries
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          cargo test --release -p fs-topopt --features cutfem-marquee --lib sdf3:: 2>&1 | tail -n 100
      - name: Test native elasticity studies and constrained continuation
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          cargo test --release -p fs-cli --features sdf3-study --lib study::elasticity 2>&1 | tail -n 100
      - name: Test native study, resume and retained report commands
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          cargo test --release -p fs-cli --features sdf3-study --test study_checkpoint_cli --test study_sdf3_cli --test study_csg3_cli --test study_embedded_cli --test study_multilevel_cli 2>&1 | tail -n 100
  trust-core:
    # Compile the complete production engine and its actual deterministic math
    # dependency, without substituting callbacks, algebra or a test-only solver.
    # This focused probe does not replace Cx/IR integration or the DSR gate.
    if: contains(github.event.head_commit.message, '[trust-check]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CARGO_PKG_VERSION: '0.1.0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compile and test the native numerical source in both profiles
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re
          root = pathlib.Path.cwd()
          lib = (root / 'crates/fs-ascent/src/lib.rs').read_text()
          aliases = '\n'.join(re.search(r'pub type ' + name + r'[^\n]+', lib).group()
                              for name in ['FnGrad', 'FnHv'])
          source = aliases + '\n'
          for name, path in [('stop', 'crates/fs-ascent/src/stop.rs'),
                             ('engine', 'crates/fs-ascent/src/trust/engine.rs')]:
              source += '#[path = ' + json.dumps(str(root / path)) + '] pub mod ' + name + ';\n'
          (pathlib.Path(os.environ['RUNNER_TEMP']) / 'trust-core.rs').write_text(source)
          PY
          git log -1 --format='%H %s'
          for opt in 0 3; do
            rustc +stable --edition=2024 --crate-name fs_math --crate-type rlib -C opt-level="$opt" crates/fs-math/src/lib.rs -o "$RUNNER_TEMP/libfs_math.rlib"
            rustc +stable --edition=2024 --test -C opt-level="$opt" --extern "fs_math=$RUNNER_TEMP/libfs_math.rlib" "$RUNNER_TEMP/trust-core.rs" -o "$RUNNER_TEMP/trust-tests-$opt"
            "$RUNNER_TEMP/trust-tests-$opt"
          done
  trust-native:
    if: contains(github.event.head_commit.message, '[trust-native]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Materialize pinned dependencies
        run: |
          if ! cargo run --manifest-path tools/bootstrap/Cargo.toml; then
            python3 - <<'PY'
          import pathlib, subprocess
          root = pathlib.Path('../franken_numpy')
          path = 'legacy_numpy_code/numpy/doc/make.bat'
          git_dir = subprocess.check_output(['git', '-C', str(root), 'rev-parse', '--absolute-git-dir'], text=True).strip()
          attributes = pathlib.Path(git_dir) / 'info/attributes'
          attributes.parent.mkdir(parents=True, exist_ok=True)
          with attributes.open('a') as f:
              f.write('\n' + path + ' -text\n')
          blob = subprocess.check_output(['git', '-C', str(root), 'show', 'HEAD:' + path])
          (root / path).write_bytes(blob)
          PY
            cargo run --manifest-path tools/bootstrap/Cargo.toml -- --offline
          fi
      - name: Test core and real Cx cancellation adapters
        if: ${{ !cancelled() }}
        run: "cargo test --release -p fs-ascent --lib trust:: -- --test-threads=1"
      - name: Test real optimization IR and reverse Hessians
        if: ${{ !cancelled() }}
        run: cargo test --release -p fs-ascent --test reverse_newton -- --test-threads=1
      - name: Test existing optimizer trajectories and golden evidence
        if: ${{ !cancelled() }}
        run: cargo test --release -p fs-ascent --test ascent_battery -- --test-threads=1
