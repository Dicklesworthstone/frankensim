name: Native thermal adjoint
on:
  push:
    branches: [main]
    paths:
      - 'crates/fs-cli/src/solve.rs'
      - 'crates/fs-cli/src/solve/nominal_adjoint*'
      - 'crates/fs-cli/src/solve/nominal_adjoint/**'
      - 'crates/fs-cli/tests/native_contact_adjoint.rs'
      - 'crates/fs-conduction/src/interface.rs'
      - 'crates/fs-conduction/src/interface/sensitivity.rs'
      - 'crates/fs-conduction/src/interface/matching*'
      - 'crates/fs-conduction/src/interface/matching/**'
      - 'crates/fs-conduction/tests/contact_controls.rs'
      - 'crates/fs-cli/tests/native_uncertainty/nominal_adjoint.rs'
      - 'crates/fs-cli/tests/native_uncertainty/nominal_adjoint/**'
      - 'crates/fs-cli/tests/native_nonlinear_adjoint.rs'
      - 'crates/fs-cli/tests/native_nonlinear_adjoint/**'
      - 'crates/fs-cli/tests/native_air_inlet_adjoint.rs'
      - 'crates/fs-airflow/src/composite.rs'
      - 'crates/fs-airflow/src/composite/**'
      - 'crates/fs-airflow/tests/composite_speed.rs'
      - 'crates/fs-airflow/src/conjugate/goal/maximum*'
      - 'crates/fs-airflow/src/conjugate/goal/maximum/**'
      - 'crates/fs-cli/src/solve/radiation.rs'
      - 'crates/fs-cli/src/solve/natural.rs'
      - 'crates/fs-conduction/src/radiation*'
      - 'crates/fs-conduction/src/radiation/**'
      - 'crates/fs-conduction/tests/ambient_radiation.rs'
      - 'crates/fs-conduction/tests/ambient_radiation/**'
      - 'crates/fs-conduction/src/adjoint/robin/nonlinear*'
      - 'crates/fs-conduction/src/adjoint/robin/nonlinear/**'
      - 'crates/fs-cli/src/study_uncertainty*'
      - 'crates/fs-cli/src/study_uncertainty/**'
      - 'crates/fs-project/src/uncertainty*'
      - 'crates/fs-project/src/uncertainty/**'
      - 'tools/radiation_core_wiring.json'
      - 'tools/radiation_cli_wiring.json'
      - 'tools/native_inlet_wiring.json'
      - '.github/workflows/native-adjoint.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  wire:
    # Bounded integration of reviewed edits to oversized source files. These
    # literal operations require exact original blobs and unique anchors.
    if: github.event_name == 'push' && (contains(github.event.head_commit.message, '[wire-native-mean-control]') || contains(github.event.head_commit.message, '[wire-radiation-core]') || contains(github.event.head_commit.message, '[wire-radiation-cli]') || contains(github.event.head_commit.message, '[wire-native-inlet]'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Integrate the exact reviewed sources directly on main
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          choices = {
              '[wire-native-mean-control]': ('tools/native_mean_control_wiring.json', 'feat(cli): freeze native nominal adjoints before uncertainty sampling'),
              '[wire-radiation-core]': ('tools/radiation_core_wiring.json', 'feat(conduction): expose card-backed radiation adjoints and native FEM regressions'),
              '[wire-radiation-cli]': ('tools/radiation_cli_wiring.json', 'feat(cli): retain original radiation laws through native thermal adjoints'),
              '[wire-native-inlet]': ('tools/native_inlet_wiring.json', 'feat(cli): version native air-inlet adjoint solve receipts'),
          }
          selected = [value for key, value in choices.items() if key in os.environ['COMMIT_MESSAGE']]
          if len(selected) != 1:
              raise SystemExit('exactly one reviewed integration must be selected')
          manifest, message = selected[0]
          edits = json.loads(pathlib.Path(manifest).read_text())
          changed = {}
          for name, rule in edits.items():
              path = pathlib.Path(name)
              if path.is_symlink() or not path.is_file() or not name.startswith('crates/') or '..' in path.parts:
                  raise SystemExit(f'not an ordinary crate source: {name}')
              raw = path.read_bytes()
              oid = hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest()
              if oid != rule['git_blob']:
                  raise SystemExit(f'{name} changed; manual integration required')
              text = raw.decode()
              for edit in rule['edits']:
                  if text.count(edit['old']) != 1:
                      raise SystemExit(f'{name}: missing or ambiguous integration anchor')
                  text = text.replace(edit['old'], edit['new'], 1)
              changed[path] = text.encode()
          for path, raw in changed.items():
              path.write_bytes(raw)
          subprocess.run(['git', 'diff', '--check'], check=True)
          subprocess.run(['git', 'config', 'user.name', 'ChatGPT'], check=True)
          subprocess.run(['git', 'config', 'user.email', 'noreply@openai.com'], check=True)
          subprocess.run(['git', 'add', '--', *edits], check=True)
          subprocess.run(['git', 'commit', '-m', message], check=True)
          subprocess.run(['git', 'push', 'origin', 'HEAD:main'], check=True)
          PY
  native:
    needs: wire
    if: always() && (needs.wire.result == 'success' || needs.wire.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_RELEASE_DEBUG: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Record exact tested source
        run: git log -1 --format='%H %s'
      - name: Materialize pinned dependencies
        shell: bash
        run: |
          set -euo pipefail
          if ! cargo run --manifest-path tools/bootstrap/Cargo.toml; then
            # Preserve exact dependency pins; repair only this known checkout
            # line-ending discrepancy, not any substantive upstream source.
            python3 - <<'PY'
          import json, pathlib, subprocess
          root = pathlib.Path('../franken_numpy')
          row = next(r for r in json.loads(pathlib.Path('constellation.lock').read_text())['libraries'] if r['lib'] == 'franken_numpy')
          def git(*args):
              return subprocess.check_output(['git', '-C', str(root), *args])
          if git('rev-parse', 'HEAD').decode().strip() != row['git_head'] or git('config', '--local', '--get', 'frankensim.bootstrapIncomplete').strip() != b'true':
              raise SystemExit('not the incomplete pinned NumPy clone; refusing repair')
          name = 'legacy_numpy_code/numpy/doc/make.bat'
          path = root / name
          if path.is_symlink() or not path.is_file():
              raise SystemExit('expected an ordinary tracked batch file')
          raw = git('cat-file', 'blob', row['git_head'] + ':' + name)
          actual = path.read_bytes()
          if actual == raw or actual.replace(b'\r\n', b'\n') != raw.replace(b'\r\n', b'\n'):
              raise SystemExit('not a line-ending-only checkout discrepancy')
          path.write_bytes(raw)
          git('add', '--', name)
          if git('rev-parse', ':' + name).strip() != git('rev-parse', row['git_head'] + ':' + name).strip() or path.read_bytes() != raw:
              raise SystemExit('restoration differs from locked source or index')
          PY
            cargo run --manifest-path tools/bootstrap/Cargo.toml
          fi
      - name: Compare bound contact controls with physical FEM re-solves
        if: ${{ !cancelled() }}
        run: cargo test --release -p fs-conduction --test contact_controls -- --test-threads=1
      - name: Test complete mean-coefficient FEM feedback
        if: ${{ !cancelled() }}
        run: cargo test --release -p fs-conduction --lib mean_feedback -- --test-threads=1
      - name: Compare native contact adjoints with real card and physics re-solves
        if: ${{ !cancelled() }}
        run: cargo test --release -p fs-cli --test native_contact_adjoint -- --test-threads=1
      - name: Test independent branch inlet pullbacks
        run: cargo test --release -p fs-airflow --lib inlet -- --test-threads=1
      - name: Compare independent fan-bank hydraulic derivatives with physical roots
        if: ${{ !cancelled() }}
        run: cargo test --release -p fs-airflow --test composite_speed -- --test-threads=1
      - name: Compare native inlet adjoints and resumed uncertainty studies
        if: ${{ !cancelled() }}
        run: cargo test --release -p fs-cli --test native_air_inlet_adjoint -- --test-threads=1
      - name: Compare conductivity controls with heterogeneous nonlinear FEM re-solves
        if: ${{ !cancelled() }}
        run: cargo test --release -p fs-conduction --lib material_controls -- --test-threads=1
      - name: Test card-backed radiation FEM feedback against physical re-solves
        if: ${{ !cancelled() }}
        run: cargo test --release -p fs-conduction --test ambient_radiation adjoint -- --test-threads=1
      - name: Test existing and nominal calibration policies
        if: ${{ !cancelled() }}
        run: cargo test --release -p fs-project --lib uncertainty -- --test-threads=1
      - name: Test actual native adjoint contractions
        if: ${{ !cancelled() }}
        run: cargo test --release -p fs-cli --lib nominal_adjoint -- --test-threads=1
      - name: Compare native adjoints with physical re-solves
        if: ${{ !cancelled() }}
        run: cargo test --release -p fs-cli --test native_uncertainty nominal_adjoint -- --test-threads=1
      - name: Compare nonlinear material adjoints through the native project pipeline
        if: ${{ !cancelled() }}
        run: cargo test --release -p fs-cli --test native_nonlinear_adjoint -- --test-threads=1
