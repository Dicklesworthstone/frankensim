      - 'crates/fs-couple/src/flue_loop/**'
      - 'crates/fs-couple/src/bernoulli_aperture/wall.rs'
      - 'crates/fs-couple/src/bernoulli_aperture/wall/**'
      - 'crates/fs-couple/tests/material_duct_wall.rs'
      - 'crates/fs-couple/tests/material_duct_wall/**'
      - 'crates/fs-couple/src/bowed_string.rs'
      - 'crates/fs-couple/src/bowed_string/material.rs'
      - 'crates/fs-couple/examples/material_strings.rs'
      - 'crates/fs-couple/examples/material_strings/**'
      - 'crates/fs-couple/src/render/schedule/force.rs'
      - 'crates/fs-couple/src/render/schedule/force/program.rs'
      - 'crates/fs-couple/tests/force_program.rs'
      - 'crates/fs-couple/tests/material_bow_interface/**'
      - 'crates/fs-couple/src/render/schedule/force/coupled/contact/friction*'
      - 'crates/fs-couple/src/render/schedule/force/coupled/contact/friction/**'
      - 'crates/fs-couple/src/render/schedule/force/coupled/render/friction.rs'
      - 'crates/fs-couple/tests/modal_multi_friction.rs'
      - 'crates/fs-couple/tests/material_multi_bow.rs'
      - 'crates/fs-couple/tests/modal_friction_interface.rs'
      - 'crates/fs-couple/tests/material_bow_interface.rs'
      - 'crates/fs-tribo/src/lib.rs'
      - 'crates/fs-couple/tests/bowed_material_gas.rs'
      - 'crates/fs-couple/tests/material_string_torsion.rs'
      - 'crates/fs-material/src/section.rs'
      - 'crates/fs-material/src/section/torsion.rs'
      - 'crates/fs-material/tests/torsional_section.rs'
      - 'crates/fs-couple/src/bowed_string/runtime/reciprocal.rs'
      - 'crates/fs-couple/src/bowed_string/runtime/reciprocal/**'
      - 'crates/fs-couple/tests/material_string_bank.rs'
      - 'crates/fs-couple/tests/material_plate_chart_bank.rs'
      - 'crates/fs-couple/src/thin_plate.rs'
      - 'crates/fs-couple/src/thin_plate/**'
      - 'crates/fs-couple/src/cavity_modal.rs'
      - 'crates/fs-couple/src/cavity_modal/**'
      - 'crates/fs-couple/tests/reciprocal_cavity.rs'
      - 'crates/fs-couple/src/cavity_phs/piston.rs'
      - 'crates/fs-couple/src/cavity_phs/piston/**'
      - 'crates/fs-material/examples/material_gas_spring/**'
      - 'crates/fs-material/src/gas*.rs'
      - 'crates/fs-couple/src/bernoulli_aperture/performance.rs'
      - 'crates/fs-couple/src/bernoulli_aperture/performance/force.rs'
      - 'crates/fs-couple/src/bernoulli_aperture/performance/file*'
      - 'crates/fs-couple/src/bernoulli_aperture/performance/file/**'
      - 'crates/fs-couple/src/bernoulli_aperture/network/regional.rs'
      - 'crates/fs-couple/src/bernoulli_aperture/paired*'
      - 'crates/fs-couple/src/bernoulli_aperture/paired/**'
      - 'crates/fs-couple/src/bernoulli_aperture/paired_network/**'
      - 'crates/fs-couple/src/bernoulli_aperture/slit_channel*'
      - 'crates/fs-couple/src/bernoulli_aperture/slit_channel/**'
      - 'crates/fs-couple/tests/slit_channel.rs'
      - 'crates/fs-couple/tests/circular_channel.rs'
      - 'crates/fs-couple/src/dg_port*'
      - 'crates/fs-couple/src/dg_port/**'
      - 'crates/fs-couple/src/bernoulli_aperture/two_sided*'
      - 'crates/fs-couple/src/bernoulli_aperture/two_sided/**'
      - 'crates/fs-couple/tests/two_sided*'
      - 'crates/fs-couple/examples/two_sided_reed.rs'
      - 'crates/fs-vfit/src/waveguide/network.rs'
      - 'crates/fs-vfit/tests/waveguide_pair.rs'
      - 'crates/fs-couple/src/bernoulli_aperture/dynamic/relaxation.rs'
      - 'crates/fs-couple/src/bin/music_render/duct_metadata.rs'
      - 'crates/fs-couple/examples/plate-valve-mixture*.performance'
      - 'crates/fs-couple/tests/music_render_wind*'
      - 'crates/fs-couple/tests/music_render_wind/**'
      - '.github/workflows/instrument-materials.yml'
permissions:
  contents: read
jobs:
  instruments:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: '2'
      RUST_MIN_STACK: '33554432'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Keep complete Cargo logs with bounded console diagnostics
        run: |
          mkdir -p "$RUNNER_TEMP/instrument-material-logs"
          cat > "$RUNNER_TEMP/instrument-material-cargo.bash" <<'BASH'
          cargo() {
            local log code
            log="$(mktemp "$RUNNER_TEMP/instrument-material-logs/cargo-${GITHUB_ACTION:-local}-XXXXXXXX.log")"
            {
              printf 'cargo'
              printf ' %q' "$@"
              printf '\n'
            } | tee "$log"
            if command cargo "$@" >>"$log" 2>&1; then code=0; else code=$?; fi
            printf 'Exit %s; full output: %s\n' "$code" "${log##*/}"
            if (( code == 0 )); then
              grep -E '^(test result:|[[:space:]]*(Finished|Running) )' "$log" || true
            else
              grep -n -m 10 -B 2 -A 12 -E '^error(\[|:)' "$log" || true
              tail -n 120 "$log" || true
            fi
            return "$code"
          }
          unset BASH_ENV
          BASH
          printf 'BASH_ENV=%s\n' "$RUNNER_TEMP/instrument-material-cargo.bash" >> "$GITHUB_ENV"
      - name: Materialize the existing pinned dependencies
        run: cargo run --manifest-path tools/bootstrap/Cargo.toml
      - name: Material multimode reeds and retained pressure feedback
        if: ${{ !cancelled() }}
        run: cargo test -p fs-couple --test modal_aperture -- --test-threads=1
      - name: Interior and exterior gas at flanged modal openings
        if: ${{ !cancelled() }}
        run: |
          cargo test -p fs-duct --lib flanged:: -- --test-threads=1
      - name: Native source-file policy and unchanged physical audio
        if: ${{ !cancelled() }}
        run: cargo test -p fs-couple --test music_render_wind self_contained -- --test-threads=1
      - name: Current Nolle source feedback and transactional flute state
        if: ${{ !cancelled() }}
        run: |
          cargo test -p fs-couple --lib flue_loop::convection_tests:: -- --test-threads=1
      - name: Matched exterior reaction and instrument pressure
        if: ${{ !cancelled() }}
        run: |
          cargo test -p fs-couple --test baffled_environment -- --test-threads=1
          cargo check -p fs-couple --example two_sided_reed
          demo="$(mktemp -d)"
          cargo run -p fs-couple --example two_sided_reed -- "$demo/exterior293.wav" 0.12 900 293.15
          cargo run -p fs-couple --example two_sided_reed -- "$demo/exterior333.wav" 0.12 900 333.15
      - name: Nonlinear mouth loss and physical flute pressure
        if: ${{ !cancelled() }}
        run: |
          cargo test -p fs-couple --no-fail-fast --test contraction_loss --test flue_contraction -- --test-threads=1
          cargo test -p fs-couple --lib flue_loop::mouth_loss:: -- --test-threads=1
          demo="$(mktemp -d)"
          cargo run -p fs-couple --example flue_contraction -- "$demo/linear.wav" none 101325 1
          cargo run -p fs-couple --example flue_contraction -- "$demo/contracted.wav" 0.6 101325 1
      - name: Pack-driven material plucks and bowed pressure
        if: ${{ !cancelled() }}
        run: cargo test -p fs-couple --example material_strings -- --test-threads=1
      - name: Compile external material packs and render source-driven fixtures
        if: ${{ !cancelled() }}
        run: |
          demo="$(mktemp -d)"
          cp crates/fs-couple/examples/material_strings/*.tsv "$demo/"
          cp crates/fs-couple/examples/material_strings/*.material-strings "$demo/"
          cargo run -p xtask -- matdb-pack --manifest "$demo/wire-manifest.tsv" --out "$demo/wire.fsmatpk"
          cargo run -p xtask -- matdb-pack --manifest "$demo/body-manifest.tsv" --out "$demo/body.fsmatpk"
          cargo run -p fs-couple --example material_strings -- "$demo/pluck.material-strings" "$demo/pluck.wav"
          cargo run -p fs-couple --example material_strings -- "$demo/pluck-and-bow.material-strings" "$demo/pluck-and-bow.wav"
      - name: Fractional acoustic storage and material instrument feedback
        if: ${{ !cancelled() }}
        run: |
          cargo test -p fs-vfit --no-fail-fast --test fractional_waveguide --test fractional_network --test waveguide_pair -- --test-threads=1
          cargo test -p fs-couple --no-fail-fast --test fractional_tubes --test fractional_flue --test fractional_viscothermal --test two_sided_aperture --test two_sided_pressure -- --test-threads=1
      - name: Material walls and multi-outlet flute pressure
        if: ${{ !cancelled() }}
        run: cargo test -p fs-couple --test material_duct_wall -- --test-threads=1
      - name: Source-bound interfaces, string loads and plucks
        if: ${{ !cancelled() }}
        run: cargo test -p fs-couple --no-fail-fast --test force_program --test modal_friction_interface --test material_bow_interface -- --test-threads=1
      - name: Shared circular and slit momentum with coupled duct and flute feedback
        if: ${{ !cancelled() }}
        run: |
          cargo test -p fs-couple --no-fail-fast --test slit_channel --test circular_channel -- --test-threads=1
          cargo test -p fs-couple --lib dg_port:: -- --test-threads=1
          cargo test -p fs-couple --lib flue_loop::dg::performance::tests::channels -- --test-threads=1
      - name: Two-sided material reed physics and exterior pressure
        if: ${{ !cancelled() }}
        run: |
          cargo test -p fs-vfit --test waveguide_pair -- --test-threads=1
          cargo test -p fs-couple --no-fail-fast --test two_sided_aperture --test two_sided_pressure -- --test-threads=1
          cargo check -p fs-couple --example two_sided_reed
      - name: Regional TMM gas ports and uniform parity
        if: ${{ !cancelled() }}
        run: |
          cargo test -p fs-couple --lib driving_point::regional:: -- --test-threads=1
      - name: Regional and uniform gas reed mechanics
        if: ${{ !cancelled() }}
        run: |
          cargo test -p fs-couple --lib render::schedule::reed:: -- --test-threads=1
      - name: Gas reed wind and ensemble CLI PCM
        if: ${{ !cancelled() }}
        run: cargo test -p fs-couple --test reed_gas_mixture -- --test-threads=1
      - name: Uniform and regional material bending loss through coupled sound
        if: ${{ !cancelled() }}
        run: |
          cargo test -p fs-couple --lib thin_plate:: -- --test-threads=1
      - name: Source-bound rotary inertia and torsional shear loss
        if: ${{ !cancelled() }}
        run: cargo test -p fs-material --no-fail-fast --test torsional_section --test linear_interface -- --test-threads=1
      - name: Material torsion in surface bow contact and scheduled pressure
        if: ${{ !cancelled() }}
        run: cargo test -p fs-couple --test material_string_torsion -- --test-threads=1
      - name: Simultaneous material bows and original friction playback
        if: ${{ !cancelled() }}
        run: cargo test -p fs-couple --no-fail-fast --test modal_multi_friction --test material_multi_bow --test modal_friction --test music_render_friction -- --test-threads=1
      - name: Independent hereditary blades and acoustic networks
        if: ${{ !cancelled() }}
        run: |
          cargo test -p fs-couple --lib bernoulli_aperture::paired -- --test-threads=1
      - name: Retained scalar and symmetric plate material physics
        if: ${{ !cancelled() }}
        run: |
          cargo test -p fs-couple --test plate_aperture -- --test-threads=1
          cargo test -p fs-couple --test opposed_plate_aperture -- --test-threads=1
      - name: Regional material geometry in shared string body and cavity mechanics
        if: ${{ !cancelled() }}
        run: cargo test -p fs-couple --test material_plate_chart_bank -- --test-threads=1
      - name: Named gas material admission and pressure response
        if: ${{ !cancelled() }}
        run: |
          cargo test -p fs-material --lib gas_species:: -- --test-threads=1
      - name: Wind gas parser coupled physics and legacy parity
        if: ${{ !cancelled() }}
        run: |
          cargo test -p fs-couple --lib performance::file:: -- --test-threads=1
      - name: Mixture wind and ensemble CLI PCM
        if: ${{ !cancelled() }}
        run: |
          cargo test -p fs-couple --test music_render_wind gas_mixture:: -- --test-threads=1
          cargo test -p fs-couple --test music_render_wind material_modal:: -- --test-threads=1
      - name: Source-bound finite thermal storage gas and piston mechanics
        if: ${{ !cancelled() }}
        run: |
          cargo test -p fs-couple --lib cavity_phs::piston:: -- --test-threads=1
      - name: Material-conductivity gas-spring heat and motion
        if: ${{ !cancelled() }}
        run: cargo test --manifest-path crates/fs-material/examples/material_gas_spring/Cargo.toml -- --test-threads=1
      - name: Existing and pressure-loaded reduction tests
        if: ${{ !cancelled() }}
        run: |
          cargo test -p fs-solid --lib reduce:: -- --test-threads=1
      - name: Anisotropic and heterogeneous material specimens
        if: ${{ !cancelled() }}
        run: cargo test -p fs-solid --test valve_material_field -- --test-threads=1
      - name: Material-to-acoustic integration in an explicit gas
        if: ${{ !cancelled() }}
        run: cargo test -p fs-couple --test material_valve_assembly -- --test-threads=1
      - name: Shared homogeneous and layered bowed-string material physics
        if: ${{ !cancelled() }}
        run: cargo test -p fs-couple --test bowed_material_gas -- --test-threads=1
      - name: Shared-body sympathetic material strings
        if: ${{ !cancelled() }}
        run: |
          cargo test -p fs-couple --test material_string_bank -- --test-threads=1
          cargo test -p fs-couple --lib bowed_string::runtime::reciprocal::bank::interfaces:: -- --test-threads=1
      - name: Retained single-string reciprocal material tests
        if: ${{ !cancelled() }}
        run: |
          cargo test -p fs-couple --lib bowed_string::runtime::reciprocal::tests -- --test-threads=1
      - name: Shared Helmholtz storage in reciprocal modal mechanics
        if: ${{ !cancelled() }}
        run: cargo test -p fs-couple --lib cavity_modal -- --test-threads=1
      - name: Reciprocal material strings bodies cavities and scheduled sound
        if: ${{ !cancelled() }}
        run: cargo test -p fs-couple --test reciprocal_cavity -- --test-threads=1
      - name: Upload complete native Cargo output
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: instrument-material-logs-${{ github.run_attempt }}
          path: ${{ runner.temp }}/instrument-material-logs/*.log
          if-no-files-found: ignore
          retention-days: 7
