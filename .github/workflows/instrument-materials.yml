      - 'crates/fs-couple/src/render/schedule/reed/**'
      - 'crates/fs-couple/examples/reed-*.performance'
      - 'crates/fs-couple/tests/reed_gas_mixture*'
      - 'crates/fs-couple/tests/reed_gas_mixture/**'
      - 'crates/fs-couple/src/baffled_pressure*.rs'
      - 'crates/fs-couple/src/bernoulli_aperture/radiation.rs'
      - 'crates/fs-couple/src/bernoulli_aperture/radiation/**'
