name: Adaptive time integration
on:
  push:
    branches: [main]
    paths:
      - 'crates/fs-time/**'
      - 'crates/fs-assimilate/**'
      - 'crates/fs-ascent/src/transient.rs'
      - 'crates/fs-ascent/src/transient/**'
      - 'crates/fs-ascent/examples/transient_fit.rs'
      - 'crates/fs-ascent/examples/transient_fit/**'
      - 'crates/fs-ascent/examples/imex_calibration.rs'
      - 'crates/fs-ascent/tests/imex_calibration.rs'
      - 'crates/fs-ascent/examples/structural_calibration.rs'
      - 'crates/fs-ascent/tests/structural_calibration.rs'
      - 'crates/fs-ascent/Cargo.toml'
      - '.github/workflows/adaptive-time.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  adaptive-time:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Materialize pinned dependencies
        run: |
          if ! cargo run --manifest-path tools/bootstrap/Cargo.toml; then
            # A tracked .bat EOL rule changes raw checkout bytes. Restore only
            # this Git-clean runner file from its object, then rerun ALL checks.
            numpy=../franken_numpy
            file=legacy_numpy_code/numpy/doc/make.bat
            git -C "$numpy" diff --quiet HEAD -- "$file"
            git -C "$numpy" cat-file blob "HEAD:$file" > "$numpy/$file"
            cargo run --manifest-path tools/bootstrap/Cargo.toml
          fi
      - name: Test checked stepping and event localization
        run: "cargo test --release -p fs-time --lib adaptive::"
      - name: Test existing time-integration behavior
        run: cargo test --release -p fs-time --test time_battery
      - name: Test stiff and implicit discrete adjoints
        run: |
          cargo test --release -p fs-time --test imex_adjoint --test imex_samples --test generalized_alpha_adjoint --test structural_generalized_alpha_adjoint --test generalized_alpha_initialization --test structural_trajectory
          cargo test --release -p fs-time --lib galpha::
      - name: Run bounded impact and restart example
        run: cargo run --release -p fs-time --example rk45_impact
      - name: Test hybrid trajectory sensitivities
        run: "cargo test --release -p fs-time --lib hybrid_sensitivity::"
      - name: Test thermal control, relay and gradient-driven impact fit
        run: cargo test --release -p fs-time --example rk45_thermostat --example rk45_impact_fit --example rk45_thermal_control
      - name: Test sensor losses and multi-experiment calibration
        run: "cargo test --release -p fs-ascent --features transient-design --lib transient::"
      - name: Test ensemble state estimation
        run: "cargo test --release -p fs-assimilate --features ensemble --lib nonlinear::ensemble::"
      - name: Test CSV calibration paths
        run: cargo test --release -p fs-ascent --features transient-design --example transient_fit
      - name: Test and run stiff thermal calibration
        run: |
          cargo test --release -p fs-ascent --features transient-design --test imex_calibration
          cargo run --release -p fs-ascent --features transient-design --example imex_calibration
      - name: Test and run driven structural calibration
        run: |
          cargo test --release -p fs-ascent --features transient-design --test structural_calibration
          cargo run --release -p fs-ascent --features transient-design --example structural_calibration
  sensor-lag-algebra:
    # Compile the actual adapter and four actual algebra tests even when the
    # unrelated constellation bootstrap blocks full workspace integration.
    # This job is NOT a substitute for the complete tests above.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check sensor adapter source in debug and optimized builds
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re
          root = pathlib.Path.cwd()
          obs = root / 'crates/fs-ascent/src/transient/observations'
          traits = (root / 'crates/fs-time/src/adaptive/adjoint.rs').read_text()
          traits += obs.with_suffix('.rs').read_text()
          source = '\n'.join(re.search(r'pub trait ' + name + r'\b[^\{]*\{.*?\n\}', traits, re.S).group()
                             for name in ['OdeVjp', 'SensorModel', 'SensorFamily'])
          source += '\n#[path = ' + json.dumps(str(obs / 'lag.rs')) + '] mod lag;\nuse lag::*;\n'
          tests = (obs / 'lag/tests.rs').read_text()
          source += 'const BOUNDS:' + tests.split('const BOUNDS:', 1)[1].split('fn cfg(', 1)[0]
          names = ['augmented_rhs_transpose_matches_state_and_parameter_differences',
                   'equilibrium_initialization_propagates_direct_and_physical_dependencies',
                   'channel_shadowing_passthrough_and_readout_bias_have_distinct_derivatives',
                   'malformed_sensor_layouts_and_unknown_sources_refuse']
          for name in names:
              body = tests.split('fn ' + name + '(', 1)[1].split('\n}\n', 1)[0]
              source += 'fn ' + name + '(' + body + '\n}\n'
          source += 'fn main() { ' + '; '.join(name + '()' for name in names)
          source += '; println!("4 sensor-lag source algebra checks passed"); }\n'
          (pathlib.Path(os.environ['RUNNER_TEMP']) / 'lag_source_check.rs').write_text(source)
          PY
          for opt in 0 3; do
            rustc +stable --edition=2024 -C opt-level="$opt" "$RUNNER_TEMP/lag_source_check.rs" -o "$RUNNER_TEMP/lag-source-check-$opt"
            "$RUNNER_TEMP/lag-source-check-$opt"
          done
  ensemble-analysis:
    # The complete std-only ensemble source and its actual tests, not copied
    # formulas or substituted numerical dependencies. Cargo coverage is above.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test ensemble source in debug and optimized builds
        run: |
          for opt in 0 3; do
            rustc +stable --edition=2024 --test -C opt-level="$opt" crates/fs-assimilate/src/nonlinear/ensemble.rs -o "$RUNNER_TEMP/ensemble-tests-$opt"
            "$RUNNER_TEMP/ensemble-tests-$opt"
          done
