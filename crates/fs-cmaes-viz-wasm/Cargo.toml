[package]
name = "fs-cmaes-viz-wasm"
version = "0.2.0"
edition = "2024"
publish = false
description = "Browser (WASM) surface for CMA-ES optimization internals visualization — per-generation mean/sigma/covariance-eigendecomposition/population stream, typed refusals at the JS boundary, deterministic seeded runs."

# Own decoupled mini-workspace (the fs-wasm / fs-flyer-wasm pattern): the wasm
# binding crate never depends on the state of unrelated in-progress crates.
[workspace]

[lib]
name = "fs_cmaes_viz_wasm"
crate-type = ["cdylib", "rlib"]

[package.metadata.frankensim]
layer = "L6"

[dependencies]
# Symmetric eigendecomposition (JacobiEigh) — the same solver fs-dfo's CMA-ES
# uses, for provenance parity. fs-math for bitwise-stable transendentals.
fs-la = { path = "../fs-la" }
fs-math = { path = "../fs-math" }

# wasm-bindgen only enters the wasm32 build — native builds stay dependency-clean.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
# fs-la pulls the fs-exec cone, which needs the canonical asupersync browser
# profile on wasm32 (the fs-flyer-wasm pattern — do not leave this unpinned).
asupersync = { path = "../../../asupersync", default-features = false, features = ["wasm-browser-prod"] }
getrandom = { version = "0.4", features = ["wasm_js"] }
[lints.rust]
unsafe_code = "forbid"
