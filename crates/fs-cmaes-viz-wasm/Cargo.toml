[package]
name = "fs-cmaes-viz-wasm"
version = "0.6.9"
edition = "2024"
publish = false
description = "Versioned packed WASM ask/tell boundary over fs-dfo's full, separable, LM-CMA, and LM-MA optimizers."

# Own decoupled mini-workspace (the fs-wasm / fs-flyer-wasm pattern): the wasm
# binding crate never depends on the state of unrelated in-progress crates.
[workspace]

[lib]
name = "fs_cmaes_viz_wasm"
crate-type = ["cdylib", "rlib"]

[package.metadata.frankensim]
layer = "L6"

[features]
g1-learned = ["dep:fs-g1-train"]

[dependencies]
fs-g1-train = { path = "../fs-g1-train", optional = true }
# The sole owner of CMA sampling and state transitions.
fs-dfo = { path = "../fs-dfo" }
# Existing mathematical owners composed by the G1 flagship rollout.
fs-contact = { path = "../fs-contact" }
fs-alloc = { path = "../fs-alloc" }
fs-exec = { path = "../fs-exec" }
fs-ga = { path = "../fs-ga" }
fs-geom = { path = "../fs-geom" }
fs-mbd = { path = "../fs-mbd" }
fs-query = { path = "../fs-query" }
fs-time = { path = "../fs-time" }
fs-tribo = { path = "../fs-tribo" }

# wasm-bindgen only enters the wasm32 build — native builds stay dependency-clean.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
# fs-la pulls the fs-exec cone, which needs the canonical asupersync browser
# profile on wasm32 (the fs-flyer-wasm pattern — do not leave this unpinned).
asupersync = { path = "../../../asupersync", default-features = false, features = ["wasm-browser-prod"] }
getrandom = { version = "0.4", features = ["wasm_js"] }
[lints.rust]
unsafe_code = "forbid"
