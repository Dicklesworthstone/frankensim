[package]
name = "fs-plate"
version.workspace = true
edition.workspace = true
license-file.workspace = true
repository.workspace = true
authors.workspace = true
description = "Orthotropic thin-plate bending elements (DKT), membrane prestress, offset stiffeners, and certified modal analysis through fs-modal."

[package.metadata.frankensim]
layer = "L3"

[features]
# Spatial plate trajectories and adjoints through the shared time integrator.
transient = ["dep:fs-time", "dep:fs-solver"]

[dependencies]
fs-material = { path = "../fs-material" }
fs-modal = { path = "../fs-modal" }
fs-qty = { path = "../fs-qty" }
fs-sparse = { path = "../fs-sparse" }
fs-time = { path = "../fs-time", optional = true }
fs-solver = { path = "../fs-solver", optional = true }

[dev-dependencies]
# Consuming demo for the instrument material database (bead zwzey): a
# spruce top's modes computed from queried fs-matdb values alone.
fs-blake3 = { path = "../fs-blake3" }
fs-evidence = { path = "../fs-evidence" }
fs-matdb = { path = "../fs-matdb" }

[lints]
workspace = true

[[test]]
name = "plate_transient"
required-features = ["transient"]

[[example]]
name = "moving_plate"
required-features = ["transient"]
