[package]
name = "fs-duct"
version.workspace = true
edition.workspace = true
license-file.workspace = true
repository.workspace = true
authors.workspace = true
description = "1D viscothermal duct/horn acoustics: transfer matrices over cylinder/cone segments with Zwikker-Kosten wide-tube losses, radiation loads, and input impedance — instrument bores, mufflers, HVAC and waveguides are the same object."

[package.metadata.frankensim]
layer = "L3"

[features]
default = []
nonlinear-euler = ["dep:fs-gas", "fs-gas/experimental-euler", "dep:fs-qty"]
# Explicit finite-temperature, small-signal two-fluid channel dynamics.
superfluid = []

[dependencies]
fs-blake3 = { path = "../fs-blake3" }
fs-fft = { path = "../fs-fft" }
fs-gas = { path = "../fs-gas", optional = true }
fs-qty = { path = "../fs-qty", optional = true }
fs-la = { path = "../fs-la" }
fs-material = { path = "../fs-material" }
fs-math = { path = "../fs-math" }
fs-phs = { path = "../fs-phs" }

[dev-dependencies]
fs-evidence = { path = "../fs-evidence" }
fs-matdb = { path = "../fs-matdb" }
fs-thermochem = { path = "../fs-thermochem" }
fs-mms = { path = "../fs-mms" }
fs-rand = { path = "../fs-rand" }
fsci-special = { path = "../../../frankenscipy/crates/fsci-special", version = "=0.4.0" }
fsci-runtime = { path = "../../../frankenscipy/crates/fsci-runtime", version = "=0.4.0" }
fs-qty = { path = "../fs-qty" }
fs-bem = { path = "../fs-bem" }
fs-vvreg = { path = "../fs-vvreg" }

[[example]]
name = "nonlinear_horn"
required-features = ["nonlinear-euler"]

[[example]]
name = "nonlinear_manifold"
required-features = ["nonlinear-euler"]

[[example]]
name = "superfluid_second_sound"
required-features = ["superfluid"]

[[test]]
name = "superfluid_channel"
required-features = ["superfluid"]

[lints]
workspace = true
