[package]
name = "fs-nuclear"
version.workspace = true
edition.workspace = true
license-file.workspace = true
repository.workspace = true
authors.workspace = true
description = "Conservative prescribed fission sources, finite fuel inventory, delayed energy and shared material heat transport."

[package.metadata.frankensim]
layer = "L3"

[features]
default = []
thermal = ["dep:fs-thermal"]

[dependencies]
fs-thermal = { path = "../fs-thermal", optional = true }

[dev-dependencies]
fs-material = { path = "../fs-material" }
fs-qty = { path = "../fs-qty" }
fs-thermochem = { path = "../fs-thermochem" }

[[example]]
name = "prescribed_fission_water"
path = "examples/prescribed_fission_water.rs"
required-features = ["thermal"]

[lints]
workspace = true
