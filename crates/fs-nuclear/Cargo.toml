[package]
name = "fs-nuclear"
version.workspace = true
edition.workspace = true
license-file.workspace = true
repository.workspace = true
authors.workspace = true
description = "Conservative nuclear sources, radioactive daughter inventories, integrated decay energy and shared material heat transport."

[package.metadata.frankensim]
layer = "L3"

[features]
default = []
thermal = ["dep:fs-thermal"]

[dependencies]
fs-la = { path = "../fs-la" }
fs-math = { path = "../fs-math" }
fs-qty = { path = "../fs-qty" }
fs-rand = { path = "../fs-rand" }
fs-thermochem = { path = "../fs-thermochem" }
fs-thermal = { path = "../fs-thermal", optional = true }

[dev-dependencies]
fs-material = { path = "../fs-material" }
fs-gas = { path = "../fs-gas" }
fs-matdb = { path = "../fs-matdb" }
fs-evidence = { path = "../fs-evidence" }

[[example]]
name = "prescribed_fission_water"
path = "examples/prescribed_fission_water.rs"
required-features = ["thermal"]

[[example]]
name = "fusion_neutron_water"
path = "examples/fusion_neutron_water.rs"
required-features = ["thermal"]

[lints]
workspace = true

