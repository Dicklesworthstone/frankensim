[package]
name = "fs-mbd-material"
version.workspace = true
edition.workspace = true
license-file.workspace = true
repository.workspace = true
authors.workspace = true
description = "Source-bound material and geometry compilation to the existing rigid-body and articulated dynamics owners"

[package.metadata.frankensim]
layer = "L3"

[features]
# Keep electrical spatial solvers out of ordinary material-to-dynamics users.
electrothermal-coupling = ["dep:fs-exec", "dep:fs-lbm"]
# Constrained 3-D thermal shape uses the existing solid FEM implementation.
thermoelastic-coupling = ["dep:fs-exec", "dep:fs-solid", "dep:fs-blake3"]

[dependencies]
fs-blake3 = { path = "../fs-blake3", optional = true }
fs-solid = { path = "../fs-solid", optional = true }
fs-exec = { path = "../fs-exec", optional = true }
fs-lbm = { path = "../fs-lbm", optional = true, features = ["enthalpy-coupling"] }
fs-ga = { path = "../fs-ga" }
fs-la = { path = "../fs-la" }
fs-matdb = { path = "../fs-matdb" }
fs-material = { path = "../fs-material" }
fs-mbd = { path = "../fs-mbd" }
fs-qty = { path = "../fs-qty" }
fs-thermal = { path = "../fs-thermal" }
fs-time = { path = "../fs-time" }
fs-contact = { path = "../fs-contact" }
fs-tribo = { path = "../fs-tribo" }

[dev-dependencies]
fs-alloc = { path = "../fs-alloc" }
fs-modal = { path = "../fs-modal" }
fs-evidence = { path = "../fs-evidence" }

[lints]
workspace = true

[[example]]
name = "electrically_heated_rotor"
required-features = ["electrothermal-coupling"]

[[example]]
name = "thermal_vibration"
required-features = ["thermoelastic-coupling"]
