[package]
name = "fs-g1-train"
version = "0.1.0"
edition = "2021"
description = "G1 walking policy training: stepwise env, transformer policy, Muon/Adam, PPO+GAE"
license = "MIT"

[dependencies]
# Standalone: the env integration plugs back in when the kernel workspace
# stabilizes. For now, the transformer + Muon + PPO are self-contained.

serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# None needed — all tests are self-contained.

[workspace]

[profile.dev]
opt-level = 1
