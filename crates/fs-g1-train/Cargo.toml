[package]
name = "fs-g1-train"
version = "0.1.0"
edition = "2021"
description = "G1 walking policy training: stepwise env, transformer policy, Muon/Adam, PPO+GAE"
license = "MIT"

# Workspace-excluded standalone training crate (own [workspace] below,
# like the browser wasm workspaces); the layer declaration follows the
# fs-wasm/fs-flyer-wasm standalone precedent — it feeds the L6
# fs-cmaes-viz-wasm product's `g1-learned` feature.
[package.metadata.frankensim]
layer = "L6"

[features]
train-io = []

[dependencies]
# The transformer/Muon/PPO core and action-causal explanatory stand-in remain
# standalone. Real owner-rollout training is integrated by the sibling
# fs-cmaes-viz-wasm `g1-learned` feature so this crate does not duplicate the
# 29-DoF dynamics owner.

[[example]]
name = "train_ablation"
path = "examples/train_ablation.rs"
required-features = ["train-io"]

[[example]]
name = "finalize_ablation"
path = "examples/finalize_ablation.rs"
required-features = ["train-io"]

[dev-dependencies]
# The two train-io examples write/read their local JSON artifacts. This is not
# part of the fs-g1-train runtime dependency graph.
serde_json = "1"

[workspace]

[profile.dev]
opt-level = 1
