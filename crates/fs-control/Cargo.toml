[package]
name = "fs-control"
version.workspace = true
edition.workspace = true
license-file.workspace = true
repository.workspace = true
authors.workspace = true
description = "Sampled synchronous current control with physical three-phase voltage limits, actual-flux decoupling, and retryable anti-windup state."

[package.metadata.frankensim]
layer = "L3"

[features]
# Executable sampled policies on the shared composition contract.
component = ["dep:fs-exec", "dep:fs-ports"]

[dependencies]
fs-math = { path = "../fs-math" }
fs-exec = { path = "../fs-exec", optional = true }
fs-ports = { path = "../fs-ports", optional = true }

[dev-dependencies]
fs-alloc = { path = "../fs-alloc" }
fs-phs = { path = "../fs-phs" }
fs-system = { path = "../fs-system" }

[[test]]
name = "component"
required-features = ["component"]

[lints]
workspace = true
