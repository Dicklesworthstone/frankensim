[package]
name = "fs-flux"
version.workspace = true
edition.workspace = true
license-file.workspace = true
repository.workspace = true
authors.workspace = true
description = "Incompressible Navier-Stokes, FEEC-native: H(div)-conforming RT0 velocities (exactly divergence-free, pressure-robust), interior-penalty viscous DG, upwind convection, coupled steady and IMEX transient solves, discrete adjoints."

[package.metadata.frankensim]
layer = "L3"

[features]
default = ["continuum", "quarter-wave"]
continuum = ["cavitation", "surface-surfactant", "dep:fs-exec", "dep:fs-la", "dep:fs-material", "dep:fs-math", "dep:fs-mesh", "dep:fs-qty", "dep:fs-solid", "dep:fs-solver", "dep:fs-sparse", "dep:fs-time", "dep:fs-thermochem"]
# Thermodynamic interface forces without the bulk continuum dependency graph.
surface-surfactant = ["dep:fs-math"]
# Finite aqueous adsorption/desorption on the original surface inventories.
surface-soluble = ["surface-surfactant", "dep:fs-material", "dep:fs-thermochem"]
cavitation = ["dep:fs-material", "dep:fs-la", "dep:fs-math"]
# Nonlinear radial response with finite source-backed gas heat and pressure work.
caloric-cavitation = ["cavitation"]
quarter-wave = []
experimental-compressible = ["dep:fs-gas", "dep:fs-qty", "dep:fs-solver", "dep:fs-thermochem"]
# Observe the original coherent atmosphere on source-owned physical gas faces.
experimental-mann-inflow = ["experimental-compressible", "dep:fs-atmo", "dep:fs-math"]
experimental-miscibility = ["dep:fs-thermochem", "dep:fs-qty", "dep:fs-math"]
experimental-miscibility-material = ["experimental-miscibility", "dep:fs-material"]
# Reuse the same authored local closures as LBM and conjugate finite volumes.
experimental-sgs = ["experimental-compressible", "dep:fs-lbm", "dep:fs-math", "dep:fs-thermochem"]

[dependencies]
fs-atmo = { path = "../fs-atmo", optional = true }
fs-exec = { path = "../fs-exec", optional = true }
fs-tribo = { path = "../fs-tribo" }
fs-la = { path = "../fs-la", optional = true }
fs-material = { path = "../fs-material", optional = true }
fs-math = { path = "../fs-math", optional = true }
fs-mesh = { path = "../fs-mesh", optional = true }
fs-solid = { path = "../fs-solid", optional = true }
fs-solver = { path = "../fs-solver", optional = true }
fs-sparse = { path = "../fs-sparse", optional = true }
fs-time = { path = "../fs-time", optional = true }
fs-gas = { path = "../fs-gas", optional = true, features = ["experimental-euler"] }
fs-qty = { path = "../fs-qty", optional = true }
fs-lbm = { path = "../fs-lbm", optional = true }
fs-thermochem = { path = "../fs-thermochem", optional = true }

[dev-dependencies]
fs-alloc = { path = "../fs-alloc" }
fs-blake3 = { path = "../fs-blake3" }
fs-matdb = { path = "../fs-matdb" }
fs-evidence = { path = "../fs-evidence" }
fs-thermochem = { path = "../fs-thermochem" }
fs-qty = { path = "../fs-qty" }

[[test]]
name = "material_capillary"
path = "tests/material_capillary.rs"
required-features = ["continuum"]

