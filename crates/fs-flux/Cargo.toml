[package]
name = "fs-flux"
version.workspace = true
edition.workspace = true
license-file.workspace = true
repository.workspace = true
authors.workspace = true
description = "Incompressible Navier-Stokes, FEEC-native: H(div)-conforming RT0 velocities (exactly divergence-free, pressure-robust), interior-penalty viscous DG, upwind convection, coupled steady and IMEX transient solves, discrete adjoints."

[package.metadata.frankensim]
layer = "L3"

[features]
default = ["continuum", "quarter-wave"]
continuum = ["cavitation", "dep:fs-la", "dep:fs-material", "dep:fs-solid", "dep:fs-solver", "dep:fs-sparse", "dep:fs-time"]
cavitation = ["dep:fs-material"]
quarter-wave = []
experimental-compressible = ["dep:fs-gas", "dep:fs-qty"]

[dependencies]
fs-tribo = { path = "../fs-tribo" }
fs-la = { path = "../fs-la", optional = true }
fs-material = { path = "../fs-material", optional = true }
fs-solid = { path = "../fs-solid", optional = true }
fs-solver = { path = "../fs-solver", optional = true }
fs-sparse = { path = "../fs-sparse", optional = true }
fs-time = { path = "../fs-time", optional = true }
fs-gas = { path = "../fs-gas", optional = true, features = ["experimental-euler"] }
fs-qty = { path = "../fs-qty", optional = true }

[dev-dependencies]
fs-matdb = { path = "../fs-matdb" }
fs-evidence = { path = "../fs-evidence" }
fs-thermochem = { path = "../fs-thermochem" }
fs-qty = { path = "../fs-qty" }

[[test]]
name = "material_capillary"
path = "tests/material_capillary.rs"
required-features = ["continuum"]

[[test]]
name = "ale_gcl"
path = "tests/ale_gcl.rs"
required-features = ["continuum"]

[[test]]
name = "battery"
path = "tests/battery.rs"
required-features = ["continuum"]

[[test]]
name = "gas_film"
path = "tests/gas_film.rs"
required-features = ["continuum"]

[[test]]
name = "reduced_aero"
path = "tests/reduced_aero.rs"
required-features = ["continuum"]

[[test]]
name = "material_flow"
path = "tests/material_flow.rs"
required-features = ["continuum"]

[[test]]
name = "stokes_boundary"
path = "tests/stokes_boundary.rs"
required-features = ["continuum"]

[[example]]
name = "pressure_channel"
path = "examples/pressure_channel.rs"
required-features = ["continuum"]

[[example]]
name = "osmotic_columns"
path = "examples/osmotic_columns.rs"
required-features = ["continuum"]

[[example]]
name = "shock_box"
path = "examples/shock_box.rs"
required-features = ["experimental-compressible"]

[[example]]
name = "shock_box_3d"
path = "examples/shock_box_3d.rs"
required-features = ["experimental-compressible"]

[[example]]
name = "mixture_shock_box_3d"
path = "examples/mixture_shock_box_3d.rs"
required-features = ["experimental-compressible"]

[[example]]
name = "reacting_shock_box_3d"
path = "examples/reacting_shock_box_3d.rs"
required-features = ["experimental-compressible"]

[lints]
workspace = true
