[package]
name = "fs-conduction"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Steady heat conduction on tet complexes: FEEC 0-form weak-form assembly, anisotropic and temperature-dependent k(T) from fs-matdb with retained query receipts, Dirichlet/Neumann/Robin thermal boundary rows, and declared-globalization nonlinear solves."

[package.metadata.frankensim]
layer = "L3"

[dependencies]
fs-adjoint = { path = "../fs-adjoint" }
fs-blake3 = { path = "../fs-blake3" }
fs-exec = { path = "../fs-exec" }
fs-feec = { path = "../fs-feec" }
fs-math = { path = "../fs-math" }
fs-material = { path = "../fs-material" }
fs-matdb = { path = "../fs-matdb" }
fs-qty = { path = "../fs-qty" }
fs-rep-mesh = { path = "../fs-rep-mesh" }
fs-scenario = { path = "../fs-scenario" }
fs-solver = { path = "../fs-solver" }
fs-sparse = { path = "../fs-sparse" }
# Optional: equilibrated continuum mean enclosure (fs-verify::tet). It lives in
# this consumer so the verifier never depends on the solver (fs-conduction ->
# fs-adjoint -> fs-verify would otherwise close a cycle).
fs-verify = { path = "../fs-verify", features = ["certified-speculation"], optional = true }

[features]
equilibrated-mean = ["dep:fs-verify"]

[dev-dependencies]
fs-alloc = { path = "../fs-alloc" }
fs-evidence = { path = "../fs-evidence" }
# Dev-only, and deliberately so: the ingestion e2e (f85xj.11.7) needs the
# quarantine parser, but the production graph must stay free of fs-io.
fs-io = { path = "../fs-io" }
fs-mesh = { path = "../fs-mesh" }
fs-mms = { path = "../fs-mms" }
fs-vvreg = { path = "../fs-vvreg" }

[[example]]
name = "conduction_mean"
required-features = ["equilibrated-mean"]

[lints]
workspace = true
