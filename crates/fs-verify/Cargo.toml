[package]
name = "fs-verify"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Certified speculation verifier: equilibrated-flux a-posteriori error bounds, interval-evaluated to verified color; warm-start fallback for the nonlinear class."

[package.metadata.frankensim]
layer = "L3"

[features]
# The verifier (bead lmp4.1): OFF by default per the Ambition-Tag
# gating rule until its Gauntlet tier + kill-metric stay green.
certified-speculation = []
# Solver-independent mean-field verification; the native FEM adapter belongs
# to fs-conduction, which already consumes fs-adjoint -> fs-verify.
thermal-conduction = ["certified-speculation"]

[dependencies]
fs-blake3 = { path = "../fs-blake3" }
fs-evidence = { path = "../fs-evidence" }
fs-obs = { path = "../fs-obs" }

[dev-dependencies]
fs-alloc = { path = "../fs-alloc" }
# Native cross-crate fixtures are dev-only: production dependencies remain
# fs-conduction -> fs-adjoint -> fs-verify, never the reverse.
fs-conduction = { path = "../fs-conduction", features = ["thermal-verification"] }
fs-exec = { path = "../fs-exec" }
fs-math = { path = "../fs-math" }

[[example]]
name = "conduction_mean"
required-features = ["thermal-conduction"]

[[test]]
name = "conformance"
required-features = ["certified-speculation"]

[[test]]
name = "zoo"
required-features = ["certified-speculation"]

[[test]]
name = "economics"
required-features = ["certified-speculation"]

[lints]
workspace = true
