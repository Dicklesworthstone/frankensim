[package]
name = "fs-verify"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Certified speculation verifier: equilibrated-flux a-posteriori error bounds, interval-evaluated to verified color; warm-start fallback for the nonlinear class."

[package.metadata.frankensim]
layer = "L3"

[features]
# The verifier (bead lmp4.1): OFF by default per the Ambition-Tag
# gating rule until its Gauntlet tier + kill-metric stay green.
certified-speculation = []
# Real steady FEM primal/dual consumer; no default-path maturity promotion.
thermal-conduction = ["certified-speculation", "dep:fs-conduction", "dep:fs-exec"]

[dependencies]
fs-blake3 = { path = "../fs-blake3" }
fs-conduction = { path = "../fs-conduction", optional = true }
fs-evidence = { path = "../fs-evidence" }
fs-exec = { path = "../fs-exec", optional = true }
fs-obs = { path = "../fs-obs" }

[dev-dependencies]
fs-alloc = { path = "../fs-alloc" }
fs-math = { path = "../fs-math" }

[[example]]
name = "conduction_mean"
required-features = ["thermal-conduction"]

[[test]]
name = "conformance"
required-features = ["certified-speculation"]

[[test]]
name = "zoo"
required-features = ["certified-speculation"]

[[test]]
name = "economics"
required-features = ["certified-speculation"]

[lints]
workspace = true
