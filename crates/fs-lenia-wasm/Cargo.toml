[package]
name = "fs-lenia-wasm"
version = "0.1.0"
edition = "2024"
publish = false
description = "Browser (WASM) surface for the CMA-ES explainer site's continuous Lenia field — FFT-accelerated toroidal convolution, growth-function LUT, in-memory RGBA colormap, and a snapshot-seeded fitness evaluator for the site's CMA-ES search."

# Own decoupled mini-workspace (the fs-cmaes-viz-wasm pattern): the wasm
# binding crate never depends on the state of unrelated in-progress crates.
[workspace]

[lib]
name = "fs_lenia_wasm"
crate-type = ["cdylib", "rlib"]

[package.metadata.frankensim]
layer = "L6"

# wasm-bindgen only enters the wasm32 build — native builds stay dependency-clean.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"

[profile.release]
opt-level = 3

[lints.rust]
unsafe_code = "forbid"
