[package]
name = "fs-runtime-wasm"
version = "0.0.1"
edition = "2024"
publish = false
description = "Wasm32 browser and Node binding over the generic fs-runtime kernel."

[workspace]

[lib]
name = "fs_runtime_wasm"
crate-type = ["cdylib", "rlib"]

[package.metadata.frankensim]
layer = "L6"

[dependencies]
fs-runtime = { path = "../fs-runtime" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
asupersync = { path = "../../../asupersync", default-features = false, features = ["wasm-browser-prod"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
