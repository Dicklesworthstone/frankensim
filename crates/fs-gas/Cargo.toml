[package]
name = "fs-gas"
version.workspace = true
edition.workspace = true
license-file.workspace = true
repository.workspace = true
authors.workspace = true
description = "Source-owned conservative gas dynamics and finite-rate gas reactors."

[package.metadata.frankensim]
layer = "L3"

[features]
default = []
experimental-euler = []
material = ["dep:fs-material"]

[dependencies]
fs-math = { path = "../fs-math" }
fs-qty = { path = "../fs-qty" }
fs-thermochem = { path = "../fs-thermochem" }
fs-material = { path = "../fs-material", optional = true }

[dev-dependencies]
fs-matdb = { path = "../fs-matdb" }
fs-evidence = { path = "../fs-evidence" }

[[example]]
name = "shock_tube"
required-features = ["experimental-euler"]

[[example]]
name = "reacting_oxygen"
required-features = ["experimental-euler"]

[[example]]
name = "mixture_manifold"
required-features = ["experimental-euler"]

[lints]
workspace = true
