[package]
name = "fs-gas"
version.workspace = true
edition.workspace = true
license-file.workspace = true
repository.workspace = true
authors.workspace = true
description = "Source-owned conservative gas dynamics and finite-rate gas reactors."

[package.metadata.frankensim]
layer = "L3"

[features]
default = []
experimental-euler = ["dep:fs-thermal"]
material = ["dep:fs-material", "dep:fs-matdb"]
# Closed source-backed gas storage on the shared composition contract.
component = ["material", "dep:fs-ports", "dep:fs-exec"]

[dependencies]
fs-exec = { path = "../fs-exec", optional = true }
fs-ports = { path = "../fs-ports", optional = true }
fs-la = { path = "../fs-la" }
fs-math = { path = "../fs-math" }
fs-qty = { path = "../fs-qty" }
fs-thermochem = { path = "../fs-thermochem" }
fs-thermal = { path = "../fs-thermal", optional = true }
fs-material = { path = "../fs-material", optional = true }
fs-matdb = { path = "../fs-matdb", optional = true }

[dev-dependencies]
fs-alloc = { path = "../fs-alloc" }
fs-system = { path = "../fs-system" }
fs-matdb = { path = "../fs-matdb" }
fs-evidence = { path = "../fs-evidence" }

[[test]]
name = "component"
required-features = ["component"]

[[example]]
name = "shock_tube"
required-features = ["experimental-euler"]

[[example]]
name = "reacting_oxygen"
required-features = ["experimental-euler"]

[[example]]
name = "mixture_manifold"
required-features = ["experimental-euler"]

[lints]
workspace = true
