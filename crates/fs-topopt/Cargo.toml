[package]
name = "fs-topopt"
version.workspace = true
edition.workspace = true
license-file.workspace = true
repository.workspace = true
authors.workspace = true
description = "Density-based topology optimization: SIMP with Helmholtz filtering, Heaviside projection, exact chain-rule sensitivities, and optimality-criteria/AL drivers."

[package.metadata.frankensim]
layer = "L4"

[dependencies]
fs-blake3 = { path = "../fs-blake3" }
fs-exec = { path = "../fs-exec", optional = true }
fs-opt = { path = "../fs-opt", optional = true }
fs-qty = { path = "../fs-qty", optional = true }
fs-cutfem = { path = "../fs-cutfem", optional = true }
fs-dwr = { path = "../fs-dwr", optional = true }
fs-ivl = { path = "../fs-ivl", optional = true }
fs-adjoint = { path = "../fs-adjoint" }
fs-ascent = { path = "../fs-ascent" }
fs-feec = { path = "../fs-feec" }
fs-la = { path = "../fs-la" }
fs-material = { path = "../fs-material" }
fs-math = { path = "../fs-math" }
fs-rep-mesh = { path = "../fs-rep-mesh" }
fs-solver = { path = "../fs-solver" }
fs-solid = { path = "../fs-solid" }
fs-sparse = { path = "../fs-sparse" }
fs-spectral = { path = "../fs-spectral" }

[dev-dependencies]
fs-rand = { path = "../fs-rand" }

[features]
# Live-IR structural Newton design; only existing workspace crates are used.
newton-design = ["dep:fs-exec", "dep:fs-opt", "dep:fs-qty"]
# [F]-gated per the Ambition-Tag rule (bead b7d0).
cutfem-marquee = ["dep:fs-cutfem", "dep:fs-dwr", "dep:fs-ivl"]

[lints]
workspace = true

# Feature-gated integration target (huq.18): skipped-with-reason when the
# feature is off, never a zero-test pass.
