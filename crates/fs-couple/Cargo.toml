[package]
name = "fs-couple"
version.workspace = true
edition.workspace = true
license-file.workspace = true
repository.workspace = true
authors.workspace = true
description = "Multiphysics composition through typed port-thermodynamic relations (fs-couple): lossless Dirac interconnections, explicit storage/dissipation/source boundaries, measured energy audits, and Aitken interface acceleration without false whole-system passivity claims."

# Installation and the research example use the same material/geometry frontend.
[[bin]]
name = "material_strings"
path = "examples/material_strings.rs"
test = false
bench = false

# The native evolving material/gas journey uses the same public physical owners.
[[bin]]
name = "finite_gas_string"
path = "examples/finite_gas_string.rs"
test = false
bench = false

[package.metadata.frankensim]
layer = "L3"

[dependencies]
fs-cutfem = { path = "../fs-cutfem" }
fs-alloc = { path = "../fs-alloc" }
fs-aeroac = { path = "../fs-aeroac" }
fs-bem = { path = "../fs-bem" }
fs-blake3 = { path = "../fs-blake3" }
fs-conduction = { path = "../fs-conduction" }
fs-contact = { path = "../fs-contact" }
fs-convection = { path = "../fs-convection" }
fs-dcontact = { path = "../fs-dcontact" }
fs-duct = { path = "../fs-duct" }
fs-em = { path = "../fs-em" }
fs-evidence = { path = "../fs-evidence" }
fs-exec = { path = "../fs-exec" }
fs-feec = { path = "../fs-feec" }
fs-fft = { path = "../fs-fft" }
fs-flux = { path = "../fs-flux", optional = true, default-features = false }
fs-ga = { path = "../fs-ga" }
fs-gas = { path = "../fs-gas", optional = true, features = ["experimental-euler"] }
fs-geom = { path = "../fs-geom" }
fs-iface = { path = "../fs-iface" }
fs-la = { path = "../fs-la" }
fs-lbm = { path = "../fs-lbm", features = ["enthalpy-coupling"] }
fs-material = { path = "../fs-material" }
fs-mbd = { path = "../fs-mbd" }
fs-mbd-material = { path = "../fs-mbd-material" }
fs-matdb = { path = "../fs-matdb" }
fs-math = { path = "../fs-math" }
fs-modal = { path = "../fs-modal" }
fs-nlmodal = { path = "../fs-nlmodal" }
fs-nuclear = { path = "../fs-nuclear", optional = true, features = ["thermal"] }
fs-orbit = { path = "../fs-orbit" }
fs-phs = { path = "../fs-phs" }
fs-plate = { path = "../fs-plate" }
fs-plate-transient = { path = "../fs-plate-transient" }
fs-ports = { path = "../fs-ports" }
fs-qty = { path = "../fs-qty" }
fs-query = { path = "../fs-query" }
fs-rand = { path = "../fs-rand" }
fs-rep-frep = { path = "../fs-rep-frep" }
fs-rep-mesh = { path = "../fs-rep-mesh" }
fs-scenario = { path = "../fs-scenario" }
fs-solid = { path = "../fs-solid" }
fs-solver = { path = "../fs-solver" }
fs-sparse = { path = "../fs-sparse" }
fs-spectral = { path = "../fs-spectral" }
fs-thermal = { path = "../fs-thermal" }
fs-thermochem = { path = "../fs-thermochem" }
fs-time = { path = "../fs-time" }
fs-tribo = { path = "../fs-tribo" }
fs-vfit = { path = "../fs-vfit" }

[dev-dependencies]
fs-ivl = { path = "../fs-ivl" }
fs-modalid = { path = "../fs-modalid" }
fs-ladder = { path = "../fs-ladder" }
fs-io = { path = "../fs-io" }
fs-psycho = { path = "../fs-psycho" }
fs-substrate = { path = "../fs-substrate" }
# With the phase-chart body on the composition contract, for the comparison
# of a declared graph with the piston module's thermal contact.
fs-material = { path = "../fs-material", features = ["component"] }
fs-modal = { path = "../fs-modal" }
fs-plate = { path = "../fs-plate" }
fs-solver = { path = "../fs-solver" }
fs-evidence = { path = "../fs-evidence" }
fs-fmm = { path = "../fs-fmm" }
# The composition kernel with its owner slices: tests that compare a declared
# graph with a hand-written coupling of this crate.
fs-system = { path = "../fs-system", features = ["slices"] }
# The gas cavity on the composition contract, for the same comparison.
fs-gas = { path = "../fs-gas", features = ["component"] }
# The sliding interface on the composition contract, for the comparison of a
# declared graph with the friction-heat module.
fs-tribo = { path = "../fs-tribo", features = ["component"] }
[lints]
workspace = true

[features]
# Retained circuit/spatial dielectric switching on the finite heat timeline.
experimental-dielectric-hysteresis = ["fs-material/experimental-dielectric-hysteresis", "fs-em/dielectric-hysteresis"]
# Physical eddy-current and retained pinning losses share finite heat cells.
hysteretic-eddy-heating = ["magnetic-hysteresis"]
# Original spatial magnetic memory and physical losses on the finite heat timeline.
magnetic-hysteresis = ["fs-em/magnetic-hysteresis"]
# Prescribed fission and delayed heat on the original material thermal timeline.
nuclear-thermal = ["dep:fs-nuclear"]
# Distributed Debye loss coupled to actual finite caloric receivers.
resolved-dielectric-thermal = ["fs-em/resolved-leaky-dielectric"]
# Frontier resolved electrostatic field/circuit/body feedback on one time step.
resolved-electrostatic-circuit-motion = []
# Source-owned Maxwell-Stefan, Soret and Dufour transport in the live gas assembly.
molecular-transport = ["dep:fs-gas", "fs-gas/material"]
# Native SDF friction and sustained finite-plastic rigid tooling with finite-cell heat.
experimental-solid-contact-heat = ["fs-solid/contact"]
# Coherent winding heat and magnetic work on the native enthalpy timeline.
harmonic-winding-heating = ["fs-em/harmonic-exposure"]
# Closed-channel two-fluid friction heat on the original thermal timeline.
superfluid = ["fs-duct/superfluid"]
# Fixed-reference Stokes or native translating/rotating ALE fluid/body mechanics.
experimental-stokes-motion = ["dep:fs-flux", "fs-flux/continuum"]
# Original resolved incompressible momentum, thermal rheology and enthalpy advection.
laminar-enthalpy = ["dep:fs-flux", "fs-flux/continuum"]
# Coherent finite-film absorption on the original spatial thermal timeline.
layered-wave-heating = ["fs-em/plane-wave"]
# Original magnetized carrier absorption on finite electron/heavy gas storage.
ionized-wave-heating = ["fs-em/plane-wave", "dep:fs-gas"]
# Bounded single-bubble dynamics coupled to native compact acoustic observation.
cavitation = ["dep:fs-flux", "fs-flux/cavitation"]
# Finite source-backed gas heating inside nonlinear radial bubble dynamics.
caloric-cavitation = ["cavitation", "fs-flux/caloric-cavitation"]
# Frontier rod-motion composition; native conformance remains explicitly gated.
rod-dynamics = []
# Spatial shock loads are explicit opt-in compositions of the original gas owners.
experimental-shock-loading = ["dep:fs-gas"]
experimental-compressible = ["experimental-shock-loading", "dep:fs-flux", "fs-flux/experimental-compressible"]
# The lip on the shared nonlinear Euler bore (fs-duct's image of fs-gas).
nonlinear-brass = ["dep:fs-gas", "fs-duct/nonlinear-euler"]

