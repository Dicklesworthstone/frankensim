[package]
name = "fs-couple"
version.workspace = true
edition.workspace = true
license-file.workspace = true
repository.workspace = true
authors.workspace = true
description = "Multiphysics composition through typed port-thermodynamic relations (fs-couple): lossless Dirac interconnections, explicit storage/dissipation/source boundaries, measured energy audits, and Aitken interface acceleration without false whole-system passivity claims."

# Installation and the research example use the same material/geometry frontend.
[[bin]]
name = "material_strings"
path = "examples/material_strings.rs"
test = false
bench = false

# The native evolving material/gas journey uses the same public physical owners.
[[bin]]
name = "finite_gas_string"
path = "examples/finite_gas_string.rs"
test = false
bench = false

[package.metadata.frankensim]
layer = "L3"

[dependencies]
fs-alloc = { path = "../fs-alloc" }
fs-aeroac = { path = "../fs-aeroac" }
fs-bem = { path = "../fs-bem" }
fs-blake3 = { path = "../fs-blake3" }
fs-conduction = { path = "../fs-conduction" }
fs-contact = { path = "../fs-contact" }
fs-dcontact = { path = "../fs-dcontact" }
fs-duct = { path = "../fs-duct" }
fs-em = { path = "../fs-em" }
fs-evidence = { path = "../fs-evidence" }
fs-exec = { path = "../fs-exec" }
fs-feec = { path = "../fs-feec" }
fs-fft = { path = "../fs-fft" }
fs-flux = { path = "../fs-flux", optional = true, default-features = false, features = ["experimental-compressible"] }
fs-gas = { path = "../fs-gas", optional = true, features = ["experimental-euler"] }
fs-geom = { path = "../fs-geom" }
fs-iface = { path = "../fs-iface" }
fs-la = { path = "../fs-la" }
fs-lbm = { path = "../fs-lbm", features = ["enthalpy-coupling"] }
fs-material = { path = "../fs-material" }
fs-mbd = { path = "../fs-mbd" }
fs-mbd-material = { path = "../fs-mbd-material" }
fs-matdb = { path = "../fs-matdb" }
fs-math = { path = "../fs-math" }
fs-modal = { path = "../fs-modal" }
fs-nlmodal = { path = "../fs-nlmodal" }
fs-orbit = { path = "../fs-orbit" }
fs-phs = { path = "../fs-phs" }
fs-plate = { path = "../fs-plate" }
fs-ports = { path = "../fs-ports" }
fs-qty = { path = "../fs-qty" }
fs-rand = { path = "../fs-rand" }
fs-rep-frep = { path = "../fs-rep-frep" }
fs-rep-mesh = { path = "../fs-rep-mesh" }
fs-scenario = { path = "../fs-scenario" }
fs-solid = { path = "../fs-solid" }
fs-solver = { path = "../fs-solver" }
fs-sparse = { path = "../fs-sparse" }
fs-thermal = { path = "../fs-thermal" }
fs-thermochem = { path = "../fs-thermochem" }
fs-time = { path = "../fs-time" }
fs-tribo = { path = "../fs-tribo" }
fs-vfit = { path = "../fs-vfit" }

[dev-dependencies]
fs-convection = { path = "../fs-convection" }
fs-modalid = { path = "../fs-modalid" }
fs-ladder = { path = "../fs-ladder" }
fs-ga = { path = "../fs-ga" }
fs-io = { path = "../fs-io" }
fs-psycho = { path = "../fs-psycho" }
fs-substrate = { path = "../fs-substrate" }
fs-material = { path = "../fs-material" }
fs-modal = { path = "../fs-modal" }
fs-plate = { path = "../fs-plate" }
fs-query = { path = "../fs-query" }
fs-solver = { path = "../fs-solver" }
fs-evidence = { path = "../fs-evidence" }
[lints]
workspace = true

[features]
# Frontier rod-motion composition; native conformance remains explicitly gated.
rod-dynamics = []
# Spatial shock loads are explicit opt-in compositions of the original gas owners.
experimental-shock-loading = ["dep:fs-gas"]
experimental-compressible = ["experimental-shock-loading", "dep:fs-flux"]
# The lip on the shared nonlinear Euler bore (fs-duct's image of fs-gas).
nonlinear-brass = ["dep:fs-gas", "fs-duct/nonlinear-euler"]

[[example]]
name = "rod_motion"
required-features = ["rod-dynamics"]
