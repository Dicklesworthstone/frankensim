[package]
name = "fs-render"
version.workspace = true
edition.workspace = true
license-file.workspace = true
repository.workspace = true
authors.workspace = true
description = "Unbiased spectral path-tracing core (fs-render): the verifiable Monte-Carlo foundations — deterministic low-discrepancy sampling, cosine-weighted hemisphere sampling with a Lambertian FURNACE test (energy conservation to exactness), MIS balance/power heuristics with weight-sum audits (no energy loss/gain at strategy boundaries), and hero-wavelength spectral integration. CPU-native, deterministic, replayable."

[package.metadata.frankensim]
layer = "L5"

[dependencies]
fs-ad = { path = "../fs-ad", optional = true }
fs-alloc = { path = "../fs-alloc", optional = true }
fs-blake3 = { path = "../fs-blake3", optional = true }
fs-conduction = { path = "../fs-conduction", optional = true }
fs-evidence = { path = "../fs-evidence", optional = true }
fs-exec = { path = "../fs-exec", optional = true }
fs-geom = { path = "../fs-geom", optional = true }
fs-img = { path = "../fs-img", optional = true }
fs-ivl = { path = "../fs-ivl", optional = true }
fs-matdb = { path = "../fs-matdb", optional = true }
fs-material = { path = "../fs-material", optional = true }
fs-math = { path = "../fs-math" }
fs-mbd-material = { path = "../fs-mbd-material", optional = true, features = ["thermoelastic-coupling"] }
fs-rand = { path = "../fs-rand", optional = true }
fs-rep-nurbs = { path = "../fs-rep-nurbs", optional = true }
fs-solid = { path = "../fs-solid", optional = true }
fs-substrate = { path = "../fs-substrate", optional = true }

[dev-dependencies]
asupersync = { path = "../../../asupersync" }
fs-alloc = { path = "../fs-alloc" }
fs-ga = { path = "../fs-ga" }
fs-lbm = { path = "../fs-lbm" }
fs-matdb = { path = "../fs-matdb" }
fs-propcheck = { path = "../fs-propcheck" }
fs-qty = { path = "../fs-qty" }
fs-rep-frep = { path = "../fs-rep-frep" }

[features]
# [S] The certified sphere-tracing and deterministic scalar-BVH backends are
# selected as production defaults by frankensim-8ll9. Closeout still requires
# the recorded adversarial, workspace, nested-Wasm, and four-quadrant gates.
# The wider SIMD BVH and ray-rate claims remain separate perf-evidence work.
default = ["chart-backends"]
chart-backends = ["dep:fs-blake3", "dep:fs-evidence", "dep:fs-exec", "dep:fs-geom", "dep:fs-rep-nurbs"]
# [F]-gated per the Ambition-Tag rule: volumetric media ship disabled
# until the live-field progressive lane lands in perf-CI.
volumes = ["dep:fs-rand"]
# [F]-gated per the Ambition-Tag rule (bead qfx.5): edge-aware
# differentiable rendering, smoke tier (deterministic quadrature;
# MC/reparameterized estimators are recorded successors).
differentiable = ["chart-backends", "dep:fs-ad"]
# [F]-gated per the Ambition-Tag rule (bead 872c): the spectral path
# tracer v1 — hero-wavelength MIS over the chart backends, EXR out.
tracer = ["chart-backends", "dep:fs-alloc", "dep:fs-rand", "dep:fs-img", "dep:fs-substrate"]
# Calibrated, headless fixture and finite-emitter transport in SI photometric units.
# Explicitly opt-in while the observer/model error remains unbounded.
photometry = ["tracer", "volumes", "dep:fs-ivl"]
# Resolve optical/thermal appearance from the same material state as mechanics.
material-state = ["tracer", "dep:fs-matdb", "dep:fs-material", "dep:fs-conduction"]
# Actual accepted material-body vertices through the original solid boundary and BVH.
material-geometry = ["chart-backends", "dep:fs-mbd-material", "dep:fs-solid"]

[[test]]
name = "material_geometry"
required-features = ["material-geometry", "material-state"]

[[test]]
name = "photometry_battery"
required-features = ["photometry"]

[[test]]
name = "photometric_image"
required-features = ["photometry"]

[[test]]
name = "photometric_media"
required-features = ["photometry"]

[[test]]
name = "photometric_path"
required-features = ["photometry"]

[[example]]
name = "photometric_stage"
required-features = ["photometry"]

[[example]]
name = "photometric_error_budget"
required-features = ["photometry"]

[[test]]
name = "volumes_battery"
required-features = ["volumes"]

[[test]]
name = "tracer_battery"
required-features = ["tracer"]

[[test]]
name = "thermal_surface"
required-features = ["tracer"]

[[test]]
name = "absorbing_transport"
required-features = ["tracer", "volumes"]

[[test]]
name = "dielectric_battery"
required-features = ["tracer"]

[[test]]
name = "lighting_battery"
required-features = ["tracer"]

[[test]]
name = "tile_parallel_battery"
required-features = ["tracer"]

[[test]]
name = "adaptive_battery"
required-features = ["tracer"]

[[test]]
name = "checkpoint_battery"
required-features = ["tracer"]

[[test]]
name = "aov_battery"
required-features = ["tracer"]

[[test]]
name = "aov_checkpoint_battery"
required-features = ["tracer"]

[[test]]
name = "diff_battery"
required-features = ["differentiable"]

[lints]
workspace = true

# Feature-gated integration target (huq.18): skipped-with-reason when the
# feature is off, never a zero-test pass.
[[test]]
name = "charts"
required-features = ["chart-backends"]

[[test]]
name = "instances"
required-features = ["chart-backends"]
