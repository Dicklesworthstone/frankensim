[package]
name = "fs-lbm"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Lattice Boltzmann core (fs-lbm): a D2Q9 BGK stream-and-collide solver with Guo body forcing and halfway bounce-back walls (verified against analytic Poiseuille flow), plus the lattice-scaling assistant that automates the dx/dt/tau/Mach bookkeeping under stability constraints — the chronic source of human LBM error that agents should never touch raw."

[package.metadata.frankensim]
layer = "L3"

[dependencies]
fs-blake3 = { path = "../fs-blake3" }
fs-evidence = { path = "../fs-evidence" }
fs-exec = { path = "../fs-exec" }
fs-matdb = { path = "../fs-matdb" }
fs-math = { path = "../fs-math" }
fs-qty = { path = "../fs-qty" }

[dev-dependencies]
fs-fft = { path = "../fs-fft" }
fs-obs = { path = "../fs-obs" }
fs-roofline = { path = "../fs-roofline" }

[lints]
workspace = true
