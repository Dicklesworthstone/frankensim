[package]
name = "fs-lbm"
version.workspace = true
edition.workspace = true
license-file.workspace = true
repository.workspace = true
authors.workspace = true
description = "Lattice Boltzmann core (fs-lbm): a D2Q9 BGK stream-and-collide solver with Guo body forcing and halfway bounce-back walls (verified against analytic Poiseuille flow), plus the lattice-scaling assistant that automates the dx/dt/tau/Mach bookkeeping under stability constraints — the chronic source of human LBM error that agents should never touch raw."

[package.metadata.frankensim]
layer = "L3"

[features]
# Prescribed full-tensor Mann snapshots on original NSF reservoir tiles.
turbulent-inflow = ["dep:fs-atmo"]
# Keep the shared enthalpy transport opt-in for ordinary LBM consumers.
enthalpy-coupling = ["dep:fs-conduction"]
# Optional nonlinear endpoint feedback; the existing explicit path is unchanged.
implicit-enthalpy-coupling = ["enthalpy-coupling", "dep:fs-solver"]
# Nonlinear conservative free-surface thickness on the original film profiles.
thin-film-evolution = ["dep:fs-solver", "dep:fs-conduction"]

[dependencies]
# `fs-conduction` here is an alias for fs-thermal, the shared enthalpy timeline owner:
# it keeps the existing import spelling. The full conduction crate re-exports fs-thermal's
# timeline types as `transient::deposition`, so a type from either is the same type and
# there is no conversion. That full crate is the dev-dependency `fs-conduction-full`
# below, for the implicit contact test only.
fs-conduction = { package = "fs-thermal", path = "../fs-thermal", optional = true }
fs-atmo = { path = "../fs-atmo", optional = true }
fs-blake3 = { path = "../fs-blake3" }
fs-evidence = { path = "../fs-evidence" }
fs-exec = { path = "../fs-exec" }
fs-ga = { path = "../fs-ga" }
fs-la = { path = "../fs-la" }
fs-matdb = { path = "../fs-matdb" }
fs-material = { path = "../fs-material" }
fs-math = { path = "../fs-math" }
fs-mesh = { path = "../fs-mesh" }
fs-qty = { path = "../fs-qty" }
fs-sparse = { path = "../fs-sparse" }
fs-solver = { path = "../fs-solver", optional = true }
fs-time = { path = "../fs-time" }

[dev-dependencies]
# The full conduction crate, for the implicit contact test only
# (src/conjugate/flow/phase_volume/conduction/tests/implicit/contact.rs): its
# PreparedMaterialContact lives here, and the `fs-conduction` alias above (fs-thermal)
# has no contact module. A distinct name keeps the two apart.
fs-conduction-full = { package = "fs-conduction", path = "../fs-conduction" }
fs-alloc = { path = "../fs-alloc" }
fs-ladder = { path = "../fs-ladder" }
fs-convection = { path = "../fs-convection" }
fs-fft = { path = "../fs-fft" }
fs-obs = { path = "../fs-obs" }
fs-roofline = { path = "../fs-roofline" }

[lints]
workspace = true

[[example]]
name = "joule_phase_change"
required-features = ["enthalpy-coupling"]

[[example]]
name = "material_buoyant_flow"
required-features = ["enthalpy-coupling"]
