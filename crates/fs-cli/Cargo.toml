[package]
name = "fs-cli"
default-run = "frankensim"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Stable command-line surface for FrankenSim project workflows."

[package.metadata.frankensim]
layer = "L6"

[[bin]]
name = "frankensim"
path = "src/main.rs"

[dependencies]
fs-alloc = { path = "../fs-alloc" }
fs-airflow = { path = "../fs-airflow" }
fs-blake3 = { path = "../fs-blake3" }
fs-checker = { path = "../fs-checker" }
fs-conduction = { path = "../fs-conduction" }
fs-convection = { path = "../fs-convection" }
fs-couple = { path = "../fs-couple" }
fs-euler-disc-e2e = { path = "../fs-euler-disc-e2e", default-features = false }
fs-evidence = { path = "../fs-evidence" }
fs-exec = { path = "../fs-exec" }
fs-io = { path = "../fs-io" }
fs-ir = { path = "../fs-ir" }
fs-ledger = { path = "../fs-ledger" }
fs-marquee = { path = "../fs-marquee" }
fs-matdb = { path = "../fs-matdb" }
fs-matdb-store = { path = "../fs-matdb-store" }
fs-material = { path = "../fs-material" }
fs-math = { path = "../fs-math" }
fs-mesh = { path = "../fs-mesh" }
fs-opt = { path = "../fs-opt" }
fs-package = { path = "../fs-package" }
fs-project = { path = "../fs-project" }
fs-qty = { path = "../fs-qty" }
fs-rep-mesh = { path = "../fs-rep-mesh" }
fs-report = { path = "../fs-report" }
fs-session = { path = "../fs-session" }
fs-solver = { path = "../fs-solver" }
fs-topols = { path = "../fs-topols" }
fs-uq = { path = "../fs-uq" }

[dev-dependencies]
fs-geom = { path = "../fs-geom" }
fs-mbd = { path = "../fs-mbd" }

[lints]
workspace = true
