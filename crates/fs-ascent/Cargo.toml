[package]
name = "fs-ascent"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "The gradient-based optimizer stack: L-BFGS with strong-Wolfe search, trust-region Newton-Krylov (Steihaug), augmented-Lagrangian constraints with KKT certificates, Riemannian variants, and the stopping-condition algebra."

[package.metadata.frankensim]
layer = "L4"

[features]
# Opt-in physical inverse design; the default optimizer dependency graph is unchanged.
equilibrium-design = ["dep:fs-couple"]

[dependencies]
fs-adjoint = { path = "../fs-adjoint" }
fs-couple = { path = "../fs-couple", optional = true }
fs-exec = { path = "../fs-exec" }
fs-la = { path = "../fs-la" }
fs-math = { path = "../fs-math" }
fs-opt = { path = "../fs-opt" }
fs-solver = { path = "../fs-solver" }

[dev-dependencies]
# Physical inverse-design consumers; normal fs-couple use is opt-in above.
fs-couple = { path = "../fs-couple" }
fs-dcontact = { path = "../fs-dcontact" }
fs-alloc = { path = "../fs-alloc" }
fs-casebook = { path = "../fs-casebook" }
# Constellation (FrankenScipy 0.1.0 per constellation.lock): the
# section-12 cross-validation oracle — TEST-ONLY.
fsci-opt = { path = "../../../frankenscipy/crates/fsci-opt", version = "=0.2.0" }
fs-eproc = { path = "../fs-eproc" }
fs-obs = { path = "../fs-obs" }
fs-qty = { path = "../fs-qty" }
fs-ad = { path = "../fs-ad" }
fs-feec = { path = "../fs-feec" }
fs-rand = { path = "../fs-rand" }
fs-sparse = { path = "../fs-sparse" }

[lints]
workspace = true

[[test]]
name = "equilibrium_study"
required-features = ["equilibrium-design"]

[[bin]]
name = "equilibrium_fit"
path = "src/bin/equilibrium_fit.rs"
required-features = ["equilibrium-design"]

[[test]]
name = "equilibrium_fit"
required-features = ["equilibrium-design"]
