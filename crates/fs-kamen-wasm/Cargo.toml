[package]
name = "fs-kamen-wasm"
version = "0.0.1"
edition = "2024"
publish = false
description = "Browser boundary for the source-dimensioned US 5,701,965 tri-wheel stair-contact states."

[workspace]

[lib]
name = "fs_kamen_wasm"
crate-type = ["cdylib", "rlib"]

[package.metadata.frankensim]
layer = "L6"

[dependencies]
fs-mbd = { path = "../fs-mbd" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
