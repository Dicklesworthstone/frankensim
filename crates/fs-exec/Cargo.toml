[package]
name = "fs-exec"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Two-lane executor: latency lane on asupersync, work-stealing tile lane, Cx contract."

[package.metadata.frankensim]
layer = "L0"

[dependencies]
fs-alloc = { path = "../fs-alloc" }
fs-blake3 = { path = "../fs-blake3" }
fs-obs = { path = "../fs-obs" }
fs-substrate = { path = "../fs-substrate" }

[dev-dependencies]
fs-propcheck = { path = "../fs-propcheck" }

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
asupersync = { path = "../../../asupersync" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
asupersync = { path = "../../../asupersync", default-features = false, features = ["wasm-browser-prod", "runtime-core", "proc-macros", "nightly-outcome-try"] }
