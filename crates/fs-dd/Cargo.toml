[package]
name = "fs-dd"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Domain decomposition: BDDC substructuring with nodal rho scaling, corners-primal and sheaf-harmonic coarse spaces, subdomain-aligned coefficient-jump evidence, and CCD-locality metrics."

[package.metadata.frankensim]
layer = "L3"

[dependencies]
fs-geom = { path = "../fs-geom", features = ["sheaf-repair"], optional = true }
fs-math = { path = "../fs-math" }

[features]
# [M]-gated per the Ambition-Tag rule: BDDC + the sheaf-harmonic coarse
# space ship disabled until Gauntlet evidence promotes them.
bddc = []
sheaf-coarse = ["bddc", "dep:fs-geom"]

[lints]
workspace = true

# Feature-gated integration target (huq.18): skipped-with-reason when the
# feature is off, never a zero-test pass.
[[test]]
name = "bddc"
required-features = ["bddc"]
