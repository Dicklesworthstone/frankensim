[package]
name = "fs-goddard-wasm"
version = "0.0.1"
edition = "2024"
publish = false

[package.metadata.frankensim]
layer = "L6"
description = "Browser (WASM) surface for the Goddard Rocket simulation — real FrankenSim physics in the browser."

[workspace]

[lib]
name = "fs_goddard_wasm"
crate-type = ["cdylib", "rlib"]

[dependencies]
fs-mbd = { path = "../fs-mbd" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
asupersync = { path = "../../../asupersync", default-features = false, features = ["wasm-browser-prod"] }

[lints.rust]
unsafe_code = "forbid"
