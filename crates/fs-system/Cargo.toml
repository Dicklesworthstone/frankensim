[package]
name = "fs-system"
version.workspace = true
edition.workspace = true
license-file.workspace = true
repository.workspace = true
authors.workspace = true
description = "Composition kernel: a system of Components joined by connections, stepped as one with atomic publication and a window ledger"

[package.metadata.frankensim]
layer = "L3"

[features]
# Owner slices: tests that compose real physics owners on the kernel. Off by
# default so that the kernel's own tests build nothing but the kernel.
slices = ["dep:fs-mbd"]

[dependencies]
fs-exec = { path = "../fs-exec" }
fs-mbd = { path = "../fs-mbd", optional = true }
fs-ports = { path = "../fs-ports" }

[dev-dependencies]
fs-alloc = { path = "../fs-alloc" }

[[test]]
name = "rigid_body_slice"
required-features = ["slices"]

[[test]]
name = "viscous_network_slice"
required-features = ["slices"]

[lints]
workspace = true
