[package]
name = "fs-system"
version.workspace = true
edition.workspace = true
license-file.workspace = true
repository.workspace = true
authors.workspace = true
description = "Composition kernel: a system of Components joined by connections, stepped as one with atomic publication and a window ledger"

[package.metadata.frankensim]
layer = "L3"

[features]
# Owner slices: tests that compose real physics owners on the kernel. Off by
# default so that the kernel's own tests build nothing but the kernel.
slices = ["dep:fs-dcontact", "dep:fs-gas", "dep:fs-material", "dep:fs-mbd", "dep:fs-thermal"]
# Source-owned nonlinear electrical storage; keeps the default kernel small.
constitutive = ["dep:fs-phs"]
# Complete source-owned port-Hamiltonian blocks with a physical heat outlet.
phs = ["dep:fs-phs"]
# Owner slice for the linear modal structure of fs-nlmodal, kept apart from `slices` so that
# neither build pulls in the other's owners.
modal-slices = ["dep:fs-nlmodal"]
# Owner slice for modal circular plates (TensionedDisk + slice_window -> ModalStructure).
plate-slices = ["slices", "modal-slices", "dep:fs-plate", "dep:fs-modal"]

[dependencies]
fs-adjoint = { path = "../fs-adjoint" }
fs-blake3 = { path = "../fs-blake3" }
fs-dcontact = { path = "../fs-dcontact", features = ["component"], optional = true }
fs-evidence = { path = "../fs-evidence" }
fs-exec = { path = "../fs-exec" }
fs-gas = { path = "../fs-gas", features = ["component"], optional = true }
fs-la = { path = "../fs-la" }
fs-matdb = { path = "../fs-matdb" }
fs-material = { path = "../fs-material", optional = true }
fs-math = { path = "../fs-math" }
fs-mbd = { path = "../fs-mbd", optional = true }
fs-modal = { path = "../fs-modal", optional = true }
fs-nlmodal = { path = "../fs-nlmodal", optional = true }
fs-phs = { path = "../fs-phs", optional = true }
fs-plate = { path = "../fs-plate", optional = true }
fs-orbit = { path = "../fs-orbit" }
fs-ports = { path = "../fs-ports" }
fs-qty = { path = "../fs-qty" }
fs-scenario = { path = "../fs-scenario" }
fs-solver = { path = "../fs-solver" }
fs-thermal = { path = "../fs-thermal", optional = true }

[dev-dependencies]
fs-alloc = { path = "../fs-alloc" }

[[test]]
name = "rigid_body_slice"
required-features = ["slices"]

[[test]]
name = "viscous_network_slice"
required-features = ["slices"]

[[test]]
name = "thermal_timeline_slice"
required-features = ["slices"]

[[test]]
name = "relaxation_network_slice"
required-features = ["slices"]

[[test]]
name = "gas_cavity_slice"
required-features = ["slices"]

[[test]]
name = "modal_plate_slice"
required-features = ["plate-slices"]

[[test]]
name = "modal_cavity_slice"
required-features = ["plate-slices", "phs"]

[[test]]
name = "modal_strike_slice"
required-features = ["plate-slices"]

[[test]]
name = "painleve_rod"
required-features = ["slices"]

[[test]]
name = "pose_gap"
required-features = ["slices"]

[[test]]
name = "pawl_catch"
required-features = ["slices"]

[[test]]
name = "modal_structure_slice"
required-features = ["modal-slices"]

[[test]]
name = "loaded_modal_slice"
required-features = ["modal-slices"]

[[test]]
name = "constitutive"
required-features = ["constitutive"]

[[test]]
name = "phs"
required-features = ["phs"]

[[test]]
name = "phs_exact"
required-features = ["phs"]

[[test]]
name = "circuit"
required-features = ["phs"]

[lints]
workspace = true
