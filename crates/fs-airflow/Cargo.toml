[package]
name = "fs-airflow"
version.workspace = true
edition.workspace = true
license-file.workspace = true
repository.workspace = true
authors.workspace = true
description = "Typed fan curves, uncertain loss networks, certified operating-point roots, and convection handoffs."

[package.metadata.frankensim]
layer = "L3"

[features]
default = []
compartment-fire = ["dep:fs-gas", "dep:fs-la", "dep:fs-thermal", "dep:fs-thermochem"]

[dependencies]
fs-blake3 = { path = "../fs-blake3" }
fs-conduction = { path = "../fs-conduction" }
fs-convection = { path = "../fs-convection" }
# The conjugate driver: port/conservation-role algebra (PortKind, EnergyAudit)
# and the scalar Aitken relaxer. fs-couple has no coupling-loop driver and its
# contract assigns one to the consumer, which is what `conjugate` builds.
fs-couple = { path = "../fs-couple" }
fs-evidence = { path = "../fs-evidence" }
fs-gas = { path = "../fs-gas", features = ["experimental-euler"], optional = true }
fs-la = { path = "../fs-la", optional = true }
fs-thermal = { path = "../fs-thermal", optional = true }
fs-thermochem = { path = "../fs-thermochem", optional = true }
# Cancellation checkpoints at conjugate outer-iteration boundaries.
fs-exec = { path = "../fs-exec" }
fs-ivl = { path = "../fs-ivl" }
# The CHT fidelity ladder: fs-airflow supplies the real correlation-rung
# transfer that replaces the Refine1d demonstrator.
fs-ladder = { path = "../fs-ladder" }
fs-math = { path = "../fs-math" }
# One resolved medium supplies hydraulics, convection and transported heat.
fs-material = { path = "../fs-material" }
fs-qty = { path = "../fs-qty" }
fs-regime = { path = "../fs-regime" }
# Reuse checked matrix-free CG for implicit hydraulic derivatives.
fs-solver = { path = "../fs-solver" }
fs-sparse = { path = "../fs-sparse" }

[dev-dependencies]
fs-alloc = { path = "../fs-alloc" }
# Reuse the native graph's cell identities and signed mass-flow connections.
fs-thermal = { path = "../fs-thermal" }
# Exercise convection on the original coupled electrical/thermal/gas network.
fs-phs = { path = "../fs-phs" }
# Test-only authority for the declared base-to-fin bondline cards in the
# plate-fin end-to-end fixture.
fs-matdb = { path = "../fs-matdb" }
fs-rep-mesh = { path = "../fs-rep-mesh" }

[[example]]
name = "compartment_fire"
required-features = ["compartment-fire"]

[lints]
workspace = true

[[example]]
name = "ventilated_compartment_fire"
path = "examples/ventilated_compartment_fire.rs"
required-features = ["compartment-fire"]
