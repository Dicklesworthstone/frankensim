[package]
name = "fs-euler-disc-e2e"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Euler-disc scientific contract and emergent-prediction campaign integration boundary"

[package.metadata.frankensim]
layer = "L6"

[features]
default = ["scientific-contract"]
scientific-contract = ["dep:fs-ir"]
# [F] The spectral tracer remains opt-in. The scene bridge is real product
# code, but enabling it must not silently promote fs-render's frontier tracer
# into the default scientific-contract path.
cinematic-render = ["fs-render/tracer"]
# [F] Durable renderer checkpoints remain explicitly opt-in because they bind
# the frontier tracer to the L6 Design Ledger. This feature implies the scene
# bridge and keeps fs-ledger out of the default scientific-contract graph.
render-checkpoint-ledger = ["cinematic-render", "dep:fs-ledger"]
# [F] Canonical uniform render sharding is an opt-in L6 coordinator over the
# frontier tracer and the immutable Design Ledger artifact store. The ledger
# is not a shared scheduler or multi-process writer.
render-sharding-ledger = ["render-checkpoint-ledger"]
# [F] Read-only final bundle verification composes the canonical render plan,
# image-sequence grammar, strict image inspectors, and audio artifact codec.
# It implies sharding because that plan is the independent expected-frame
# inventory; the finalizer never treats a producer manifest as its oracle.
cinematic-finalization = ["render-sharding-ledger"]
# [F] Deterministic film-specific orchestration over the typed render plan and
# existing checked artifact boundaries. This is deliberately not a generic
# workflow engine; concrete AOV/temporal producers remain separately gated.
cinematic-orchestration = ["render-sharding-ledger"]

[dependencies]
fs-blake3 = { path = "../fs-blake3" }
fs-contact = { path = "../fs-contact" }
fs-couple = { path = "../fs-couple" }
fs-evidence = { path = "../fs-evidence" }
fs-exec = { path = "../fs-exec" }
fs-flux = { path = "../fs-flux" }
fs-geom = { path = "../fs-geom" }
fs-govern = { path = "../fs-govern" }
fs-ir = { path = "../fs-ir", optional = true }
fs-img = { path = "../fs-img" }
fs-ledger = { path = "../fs-ledger", optional = true }
fs-material = { path = "../fs-material" }
fs-matdb = { path = "../fs-matdb" }
fs-math = { path = "../fs-math" }
fs-mbd = { path = "../fs-mbd" }
fs-rand = { path = "../fs-rand" }
fs-rep-frep = { path = "../fs-rep-frep" }
fs-render = { path = "../fs-render" }
fs-qty = { path = "../fs-qty" }
fs-solid = { path = "../fs-solid" }
fs-time = { path = "../fs-time" }
fs-tribo = { path = "../fs-tribo" }
fs-alloc = { path = "../fs-alloc" }

[[bin]]
name = "euler_cinematic_fixture"
path = "src/bin/euler_cinematic_fixture.rs"
required-features = ["cinematic-render"]

[[bin]]
name = "euler_cinematic_denoise"
path = "src/bin/euler_cinematic_denoise.rs"
required-features = ["cinematic-render"]

[[test]]
name = "render_scene_bridge"
required-features = ["cinematic-render"]

[[test]]
name = "render_checkpoint"
required-features = ["render-checkpoint-ledger"]

[[test]]
name = "cinematic_finalize"
required-features = ["cinematic-finalization"]

[lints]
workspace = true
