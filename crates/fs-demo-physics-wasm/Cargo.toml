[package]
name = "fs-demo-physics-wasm"
version = "0.1.0"
edition = "2024"
publish = false
description = "Browser (WASM) surface for the CMA-ES explainer site's parametric wing and bridge demo physics — analytic evaluators with typed refusals at the JS boundary, mirroring the site's TypeScript fallback math so WASM-vs-fallback is provenance, not behavior."

# Own decoupled mini-workspace (the fs-cmaes-viz-wasm pattern): the wasm
# binding crate never depends on the state of unrelated in-progress crates.
[workspace]

[lib]
name = "fs_demo_physics_wasm"
crate-type = ["cdylib", "rlib"]

[package.metadata.frankensim]
layer = "L6"

# wasm-bindgen only enters the wasm32 build — native builds stay dependency-clean.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"

[lints.rust]
unsafe_code = "forbid"
