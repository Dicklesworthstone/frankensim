[package]
name = "fs-material"
version.workspace = true
edition.workspace = true
license-file.workspace = true
repository.workspace = true
authors.workspace = true
description = "Constitutive-law and identifiability-authority kernel with consistent tangents, material cards, multi-case source closure, and evidence-bound assessments."

[package.metadata.frankensim]
layer = "L3"

[dependencies]
fs-ad = { path = "../fs-ad" }
fs-blake3 = { path = "../fs-blake3" }
fs-casebook = { path = "../fs-casebook" }
fs-evidence = { path = "../fs-evidence" }
fs-exec = { path = "../fs-exec", optional = true }
fs-fft = { path = "../fs-fft" }
fs-la = { path = "../fs-la" }
fs-matdb = { path = "../fs-matdb" }
fs-math = { path = "../fs-math" }
fs-modal = { path = "../fs-modal" }
fs-ports = { path = "../fs-ports", optional = true }
fs-qty = { path = "../fs-qty" }
fs-solver = { path = "../fs-solver" }
fs-thermal = { path = "../fs-thermal" }
fs-thermochem = { path = "../fs-thermochem" }

[dev-dependencies]
# The execution context of the composition contract's conformance kit.
fs-alloc = { path = "../fs-alloc" }
fs-rand = { path = "../fs-rand" }
# Native flow and enthalpy owners exercised together on the default kernel.
fs-system = { path = "../fs-system" }

[features]
# Explicit fitted polarization memory; no microscopic or measured-data claim.
experimental-dielectric-hysteresis = []
# Physics owners of this crate as Components of the composition contract
# (fs-ports): `phase::component` and `fluid_transport::rheology::pipe::component`.
# Off by default; the default build has no dependency on fs-ports or fs-exec.
component = ["dep:fs-ports", "dep:fs-exec"]

[lints]
workspace = true
