[package]
name = "fs-em"
version.workspace = true
edition.workspace = true
license-file.workspace = true
repository.workspace = true
authors.workspace = true
description = "Material-resolved planar magnetostatics on the shared FEEC and solver owners, with explicit field transfer to existing moving-conductor consumers."

[package.metadata.frankensim]
layer = "L3"

[features]
# Estimated fixed-condition vector play history on the original planar solver.
magnetic-hysteresis = []
# Estimated retained dielectric switching on the native nonlinear Gauss solver.
dielectric-hysteresis = ["fs-material/experimental-dielectric-hysteresis", "dep:fs-matdb"]
# Fixed-geometry total-current continuity with source-backed Ohmic leakage.
resolved-leaky-dielectric = []
plane-wave = ["dep:fs-fft", "dep:fs-matdb"]
harmonic-exposure = ["dep:fs-fft"]
# The planar nonlinear winding owner as a Component of the composition
# contract (fs-ports): `winding::component`. Off by default; the default
# build has no dependency on fs-exec.
component = ["dep:fs-exec"]

[dependencies]
fs-math = { path = "../fs-math" }
fs-feec = { path = "../fs-feec" }
fs-fft = { path = "../fs-fft", optional = true }
fs-ga = { path = "../fs-ga" }
fs-la = { path = "../fs-la" }
fs-material = { path = "../fs-material" }
fs-matdb = { path = "../fs-matdb", optional = true }
fs-phs = { path = "../fs-phs" }
fs-ports = { path = "../fs-ports" }
fs-exec = { path = "../fs-exec", optional = true }
fs-qty = { path = "../fs-qty" }
fs-rep-mesh = { path = "../fs-rep-mesh" }
fs-solver = { path = "../fs-solver" }
fs-sparse = { path = "../fs-sparse" }

[dev-dependencies]
# The execution context of the composition contract's conformance kit.
fs-alloc = { path = "../fs-alloc" }
fs-gas = { path = "../fs-gas" }
fs-thermochem = { path = "../fs-thermochem" }
fs-evidence = { path = "../fs-evidence" }
fs-exec = { path = "../fs-exec" }
fs-lbm = { path = "../fs-lbm" }
fs-matdb = { path = "../fs-matdb" }
fs-mbd = { path = "../fs-mbd" }

[lints]
workspace = true
