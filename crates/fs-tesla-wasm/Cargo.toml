[package]
name = "fs-tesla-wasm"
version = "0.0.1"
edition = "2024"
publish = false

[package.metadata.frankensim]
layer = "L6"
description = "Browser boundary for source-bounded Tesla transformer distributed-wave geometry."

[workspace]

[lib]
name = "fs_tesla_wasm"
crate-type = ["cdylib", "rlib"]

[dependencies]
fs-flux = { path = "../fs-flux", default-features = false, features = ["quarter-wave"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"

[lints.rust]
unsafe_code = "forbid"
