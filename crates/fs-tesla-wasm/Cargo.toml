[package]
name = "fs-tesla-wasm"
version = "0.0.1"
edition = "2024"
publish = false

[package.metadata.frankensim]
layer = "L6"
description = "Browser (WASM) surface for the Tesla Coil simulation — real FrankenSim physics in the browser."

[workspace]

[lib]
name = "fs_tesla_wasm"
crate-type = ["cdylib", "rlib"]

[dependencies]
fs-flux = { path = "../fs-flux" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
asupersync = { path = "../../../asupersync", default-features = false, features = ["wasm-browser-prod"] }

[lints.rust]
unsafe_code = "forbid"
