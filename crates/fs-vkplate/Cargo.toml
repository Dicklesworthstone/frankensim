[package]
name = "fs-vkplate"
version = "0.0.1"
edition = "2024"
publish = false
description = "Time-domain finite-difference thin plates and membranes: tension, bending, Berger and von Karman (shallow-shell) geometric nonlinearity, frequency-dependent loss, implicit contacts, enclosed-air and radiation coupling, Rayleigh microphones. One solver for every piece of a drum kit."

# Standalone render workspace; physical gas properties share the same material
# owner as the native continuum rather than a second set of air constants.
[workspace]

[lib]
name = "fs_vkplate"
crate-type = ["rlib"]

[package.metadata.frankensim]
layer = "L4"

[dependencies]
fs-material = { path = "../fs-material" }
fs-matdb = { path = "../fs-matdb" }
fs-math = { path = "../fs-math" }
fs-qty = { path = "../fs-qty" }

[dev-dependencies]
fs-blake3 = { path = "../fs-blake3" }
fs-evidence = { path = "../fs-evidence" }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = false

[lints.rust]
unsafe_code = "forbid"

[profile.release-perf]
inherits = "release"
debug = "line-tables-only"
strip = false
