[package]
name = "fs-vkplate"
version = "0.0.1"
edition = "2024"
publish = false
description = "Time-domain finite-difference thin plates and membranes: tension, bending, Berger and von Karman (shallow-shell) geometric nonlinearity, frequency-dependent loss, implicit contacts, enclosed-air and radiation coupling, Rayleigh microphones. One solver for every piece of a drum kit."

# Its own workspace (the fs-*-wasm pattern): std only, so offline renders and a
# browser build never depend on the state of unrelated in-progress crates.
[workspace]

[lib]
name = "fs_vkplate"
crate-type = ["rlib"]

[package.metadata.frankensim]
layer = "L4"

[dependencies]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = false

[lints.rust]
unsafe_code = "forbid"

[profile.release-perf]
inherits = "release"
debug = "line-tables-only"
strip = false
