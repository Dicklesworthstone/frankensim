schema = "frankensim.beads-template-hygiene-manifest.v1"
schema_version = 1
manifest_id = "beads-template-hygiene-v1"
suite_id = "template-lint"
bead_id = "frankensim-semantic-bead-template-hygiene-961yr.1"
manifest_path = "tests/e2e/manifests/beads-template-hygiene.toml"
harness_path = "scripts/ci/beads_template_hygiene.sh"
immutable = true
case_count = 21
suite_status = "NO_DATA_UNTIL_HARNESS_AND_RETAINED_RUN_EXIST"
authority = "TEST_CONTRACT_ONLY"
no_claim = "This manifest fixes the harness protocol and expected fixture outcomes. It does not repair a Bead, approve target semantics, authenticate a live tracker snapshot, prove the lint rules complete, or authorize capability promotion."
case_order = [
  "template-lint.inventory-empty",
  "template-lint.inventory-live",
  "template-lint.overlap-partitions",
  "template-lint.section-only",
  "template-lint.substantive-omission",
  "template-lint.wrong-type",
  "template-lint.rollup-gap",
  "template-lint.owner-review",
  "template-lint.historical-review",
  "template-lint.p0-shard",
  "template-lint.p1-shard",
  "template-lint.p2-p3-shard",
  "template-lint.br-only-apply",
  "template-lint.concurrent-drift",
  "template-lint.partial-batch",
  "template-lint.copied-boilerplate",
  "template-lint.scope-loss",
  "template-lint.inverse-replay",
  "template-lint.new-issue-regression",
  "template-lint.zero-debt-closeout",
  "template-lint.artifact-replay",
]

[schema_contract]
unknown_keys = "REFUSE"
duplicate_keys = "REFUSE"
duplicate_case_ids = "REFUSE"
missing_case_ids = "REFUSE"
extra_case_ids = "REFUSE"
ordinal_policy = "dense unsigned integers 1 through case_count"
ordering_policy = "ordinal ascending; case_order and case records must agree byte-for-byte"
input_order_invariant = true
case_id_encoding = "UTF-8"
case_id_pattern = "^template-lint\\.[a-z0-9]+(?:-[a-z0-9]+)*$"
required_case_fields = [
  "ordinal",
  "id",
  "role",
  "mode",
  "fixture",
  "perturbation",
  "expected_terminal",
  "expected_exit",
  "expected_subject_terminal",
  "expected_inner_br_category",
  "expected_event_stages",
  "expected_artifacts",
  "mutation",
  "replay",
  "expected_live_target_mutation",
  "expected_fixture_mutation",
  "inverse_required",
  "mutation_expectation",
  "authority",
  "no_claim",
  "assertions",
]
allowed_roles = [
  "positive",
  "boundary",
  "negative",
  "mutation",
  "replay",
  "closeout",
]
allowed_modes = [
  "--list",
  "--check",
  "--self-test",
  "--inventory",
  "--plan",
  "--apply-manifest REL",
  "--negative CASE",
  "--replay REL",
  "--closeout",
]
allowed_terminals = [
  "Pass",
  "UsageRefused",
  "InputRefused",
  "NoData",
  "EvidenceFailed",
  "CancelledDrained",
  "InfrastructureFailed",
  "InternalFault",
]
allowed_subject_terminals = [
  "PASS",
  "EXPECTED_REFUSAL",
  "APPLIED_AND_INVERTIBLE",
  "ROLLED_BACK",
  "RESTORED",
  "CLOSEOUT_GREEN",
  "REPLAY_EQUIVALENT",
]
terminal_exit_map = [
  "Pass=0",
  "UsageRefused=2",
  "InputRefused=3",
  "NoData=4",
  "EvidenceFailed=5",
  "CancelledDrained=6",
  "InfrastructureFailed=7",
  "InternalFault=8",
]
allowed_mutation_bindings = [
  "none",
  "fixture-br-update-then-inverse",
  "fixture-br-drift-then-inverse",
  "fixture-br-update-failure-then-inverse",
  "fixture-br-create-then-close-containment",
]
allowed_replay_bindings = [
  "none",
  "inverse",
  "artifact-only",
]
allowed_inner_br_categories = [
  "READ_SUCCESS",
  "NO_MUTATING_BR_CALL",
  "SINGLE_UPDATE_AND_INVERSE_SUCCESS",
  "SETUP_UPDATE_THEN_GUARD_REFUSAL",
  "FORWARD_UPDATE_FAILURE_THEN_INVERSE_SUCCESS",
  "SETUP_CREATE_THEN_CLOSE_SUCCESS",
]

[source_contract]
tracker_cli = "br"
diagnostic_cli = "bv"
diagnostic_mode = "robot flags only"
mutation_transport = "br CLI only"
direct_tracker_file_edits = "FORBIDDEN"
network_access = "FORBIDDEN"
ambient_environment_authority = "NONE"
lint_commands = [
  "br lint --status open --json --no-auto-flush --no-auto-import --no-color",
  "br lint --status in_progress --json --no-auto-flush --no-auto-import --no-color",
  "br lint --status blocked --json --no-auto-flush --no-auto-import --no-color",
  "br lint --status deferred --json --no-auto-flush --no-auto-import --no-color",
  "br lint --status closed --json --no-auto-flush --no-auto-import --no-color",
  "br lint --status all --json --no-auto-flush --no-auto-import --no-color",
]
metadata_join_commands = [
  "br list --status open --limit 0 --json --no-auto-flush --no-auto-import --no-color",
  "br list --status in_progress --limit 0 --json --no-auto-flush --no-auto-import --no-color",
  "br list --status blocked --limit 0 --json --no-auto-flush --no-auto-import --no-color",
  "br list --status deferred --deferred --limit 0 --json --no-auto-flush --no-auto-import --no-color",
  "br list --status closed --limit 0 --json --no-auto-flush --no-auto-import --no-color",
  "br show ID --json --no-auto-flush --no-auto-import --no-color",
]
environment_variables_to_unset = [
  "BD_DB",
  "BD_DATABASE",
  "BEADS_JSONL",
  "BR_OUTPUT_FORMAT",
  "TOON_DEFAULT_FORMAT",
  "RUST_LOG",
]
forbidden_flags = [
  "--allow-stale",
  "--force",
]
implicit_last_touched_issue = "FORBIDDEN"
lint_warning_classes = [
  "MissingAcceptanceCriteria",
  "MissingStepsToReproduce",
  "MissingSuccessCriteria",
]
semantic_dispositions = [
  "SECTION_NAME_ONLY",
  "SUBSTANTIVE_SEMANTIC_OMISSION",
  "MALFORMED_OR_WRONG_TYPE",
  "ROLLUP_CHILD_SET_GAP",
  "OWNER_REVIEW_REQUIRED",
  "HISTORICAL_IMMUTABLE_REVIEW",
]
required_source_identity_fields = [
  "br_tool_identity",
  "br_capabilities_contract_identity",
  "br_lint_rule_identity",
  "beads_database_semantic_projection_root",
  "beads_export_sync_status_and_witness",
  "status_cut",
  "inventory_membership_root",
  "manifest_identity",
  "harness_identity",
]
source_identity_semantics = "Tracker-file byte identities are retained diagnostics, not semantic authority. Admission is bound to br version/capabilities, br sync --status, exact list/show/lint projections captured twice, and the export witness when available."
required_joined_issue_fields = [
  "issue_id",
  "title",
  "issue_type",
  "status",
  "priority",
  "owner",
  "parent",
  "missing_section",
  "existing_relevant_clauses",
  "dependencies",
  "implementation_owner",
  "evidence_owner",
  "terminal_owner",
  "testing_obligation",
  "logging_obligation",
  "replay_obligation",
  "source_closure_obligation",
  "authority",
  "no_claim",
  "disposition",
  "disposition_rationale",
  "disposition_falsifier",
]
source_drift_policy = "REFUSE_BEFORE_TARGET_MUTATION"
count_preserving_membership_drift = "REFUSE"
field_order_dependency = "FORBIDDEN"
deferred_issue_policy = "Capture independently, classify no more strongly than OWNER_REVIEW_REQUIRED, and exclude from every V1 apply manifest until explicitly reactivated and re-inventoried."

[br_contract]
version_command = "br version --json"
version_identity_fields = [
  "version",
  "build",
  "commit",
  "target",
  "features",
]
capabilities_command = "br capabilities --json"
capabilities_contract_field = "contract_version"
capabilities_contract_version = "br.capabilities.v1"
command_schema_is_stable_authority = false
lint_operation_class = "mixed"
lint_result_shape = "{total: integer warning count, issues: integer distinct issue count, results: array}"
lint_row_shape = "{id, title, type, missing, warnings, suggestions}"
list_result_shape = "{total, issues: array, limit, offset, has_more}"
show_result_shape = "array of issue-detail objects"
lint_type_field = "type"
list_and_show_type_field = "issue_type"
status_cuts = [
  "open",
  "in_progress",
  "blocked",
  "deferred",
  "closed",
  "all",
]
issue_types = [
  "bug",
  "task",
  "feature",
  "epic",
  "chore",
  "docs",
  "question",
  "custom:*",
]
priorities = [0, 1, 2, 3, 4]
lint_rule_matrix = [
  "bug: Acceptance Criteria plus Steps to Reproduce",
  "task: Acceptance Criteria",
  "feature: Acceptance Criteria",
  "epic: Success Criteria",
  "chore: no required lint section",
  "docs: no required lint section",
  "question: no required lint section",
  "custom:*: no required lint section unless an explicitly versioned repository template rule says otherwise",
]
all_status_cut_identity = "all is the exact set union of independently captured open, in_progress, blocked, deferred, and closed cuts"
json_shape_policy = "Validate names and types; never depend on object-field order, and never confuse lint issues integer with list issues array."

[classification_contract]
unit = "one issue plus its complete exact warning-row set"
conservative_precedence = [
  "HISTORICAL_IMMUTABLE_REVIEW",
  "OWNER_REVIEW_REQUIRED",
  "ROLLUP_CHILD_SET_GAP",
  "SUBSTANTIVE_SEMANTIC_OMISSION",
  "MALFORMED_OR_WRONG_TYPE",
  "SECTION_NAME_ONLY",
]
candidate_pattern_is_approval = false
nonempty_structured_acceptance_is_sufficient = false
inline_acceptance_marker_is_sufficient = false
byte_identical_generic_body_is_sufficient = false
mixed_warning_policy = "Retain every warning row, classify conflicting, mixed, ownership-sensitive, or insufficient evidence as OWNER_REVIEW_REQUIRED, and forbid heading-only auto-approval."
closed_policy = "Always HISTORICAL_IMMUTABLE_REVIEW, even when a weaker candidate signal is present."
deferred_policy = "At most OWNER_REVIEW_REQUIRED; never apply while deferred."
malformed_or_wrong_type_proof = "The only defect is an exact required-heading/type mismatch and every required issue-specific semantic obligation is otherwise complete; any mixed warning or uncertainty escalates to OWNER_REVIEW_REQUIRED."
section_name_only_proof = "Complete issue-specific semantics already exist verbatim, every required warning is heading-only, no mixed warning or copied body is present, and an exact-root owner review approves only navigation insertion."

[partition_contract]
row_identity = "issue_id plus warning_class plus missing_section"
set_a = "exact issue IDs missing Acceptance Criteria"
set_s = "exact issue IDs missing Steps to Reproduce"
set_c = "exact issue IDs missing Success Criteria"
required_partitions = [
  "A_only",
  "S_only",
  "C_only",
  "A_and_S_only",
  "A_and_C_only",
  "S_and_C_only",
  "A_and_S_and_C",
]
arithmetic_identity = "union_count = A_only + S_only + C_only + A_and_S_only + A_and_C_only + S_and_C_only + A_and_S_and_C"
counts_are_derived = true
counts_authorize_repair = false
lexical_similarity_authorizes_repair = false

[caps]
max_cases = 21
max_inventory_rows = 4096
max_warning_rows = 8192
max_warnings_per_issue = 16
max_targets_per_plan_shard = 25
max_targets_per_apply_manifest = 1
max_attempts_per_case = 3
max_case_id_bytes = 128
max_issue_id_bytes = 256
max_title_bytes = 4096
max_clause_bytes = 65536
max_relative_path_bytes = 512
max_command_arguments = 64
max_command_argument_bytes = 4096
max_log_events = 262144
max_log_line_bytes = 16384
max_artifact_bytes = 67108864
cap_exceeded_terminal = "EXPECTED_REFUSAL"
cap_exceeded_live_target_mutation = false

[cli]
mode_is_required = true
multiple_modes = "REFUSE"
unknown_mode = "REFUSE"
unknown_option = "REFUSE"
relative_paths_only = true
successful_expectation_exit = 0
assertion_failure_exit = 5
usage_error_exit = 2
input_or_schema_refusal_exit = 3
source_drift_or_apply_refusal_exit = 3
cancelled_exit = 6
expected_exit_scope = "case harness exit after comparing the observed subject terminal with this manifest"

[harness_binding]
outer_terminal_field = "expected_terminal"
outer_exit_field = "expected_exit"
subject_terminal_field = "expected_subject_terminal"
mutation_field = "mutation"
replay_field = "replay"
success_rule = "The harness emits outer Pass/0 only after the fixture produces its expected subject terminal, mutation/restoration projection, replay projection, event stages, and artifacts."
negative_case_rule = "An expected refusal is a subject terminal asserted by the fixture; observing that refusal is an outer Pass/0, while failure to refuse is EvidenceFailed/5."
no_data_rule = "The suite remains NoData/4 until both manifest and harness exist and a retained complete run passes; manifest presence alone is not evidence."

[[cli.mode]]
name = "list"
syntax = "--list"
mutates = false
contract = "Emit the 21 case IDs in frozen manifest order and nothing inferred from the live tracker."

[[cli.mode]]
name = "check"
syntax = "--check"
mutates = false
contract = "Validate manifest schema, exact case inventory, harness binding, caps, and source readability without classifying or changing a Bead."

[[cli.mode]]
name = "self-test"
syntax = "--self-test"
mutates = false
contract = "Run every frozen fixture in a disjoint test repository and require its expected terminal, exit, artifacts, and restoration seal."

[[cli.mode]]
name = "inventory"
syntax = "--inventory"
mutates = false
contract = "Capture exact lint memberships, overlaps, joined issue metadata, source identities, and an inventory root; findings are data rather than an apply authorization."

[[cli.mode]]
name = "plan"
syntax = "--plan"
mutates = false
contract = "Produce deterministic bounded shards and explicit semantic dispositions; refuse any row that lacks its required owner review."

[[cli.mode]]
name = "apply-manifest"
syntax = "--apply-manifest REL"
mutates = true
contract = "Apply one exact reviewed bounded manifest through br only, bind every precondition, and retain an inverse br plan before the first write."

[[cli.mode]]
name = "negative"
syntax = "--negative CASE"
mutates = false
contract = "Run one frozen adversarial fixture; exit zero only when the specified unsafe or stale operation is refused with no live-target mutation."

[[cli.mode]]
name = "replay"
syntax = "--replay REL"
mutates = false
contract = "Reconstruct inventory and plan solely from retained relative artifacts into a disjoint output root and compare semantic roots."

[[cli.mode]]
name = "closeout"
syntax = "--closeout"
mutates = false
contract = "Require exact zero live debt, independent inventory reconstruction, zero unreviewed rows, complete inverse/replay artifacts, and a terminal source-closure seal."

[mutation_contract]
live_target_default = "READ_ONLY"
fixture_repository_default = "READ_ONLY"
apply_preconditions = [
  "manifest identity matches",
  "source identities match",
  "exact issue membership matches",
  "issue metadata and semantic roots match",
  "the sole row has disposition SECTION_NAME_ONLY",
  "the sole row matches one exact plan proposal and proposal root",
  "the sole row carries an explicit current-owner review receipt bound to every source and proposal root",
  "the V1 apply manifest names exactly one explicit issue ID",
  "the issue is not deferred or closed",
  "complete inverse br commands are retained before the first write",
]
review_receipt_fields = [
  "schema",
  "issue_id",
  "reviewed_by",
  "current_owner",
  "source_root",
  "inventory_root",
  "plan_root",
  "proposal_root",
  "old_field_root",
  "new_field_root",
  "reservation_receipt",
  "no_claim",
]
review_receipt_policy = "The harness verifies exact field/root equality and requires reviewed_by to equal the current assignee or owner. The receipt is an explicit workflow attestation, not cryptographic identity or semantic authority, and an unassigned issue cannot be applied."
v1_apply_atomicity = "One explicit issue ID and one br update command per apply manifest; multi-target apply is forbidden until br exposes a transaction or compare-and-swap primitive covering the whole set."
pre_update_observation = "Read the explicit ID with br show and require the planned semantic root immediately before br update."
post_update_observation = "Read the same explicit ID with br show and require the exact planned post-state semantic root immediately after br update."
implicit_issue_selection = "FORBIDDEN"
force_update = "FORBIDDEN"
section_name_only_change = "Add only the missing literal navigation heading around already complete issue-specific criteria; preserve every existing semantic clause byte-for-byte."
substantive_auto_fill = "FORBIDDEN"
copied_boilerplate = "FORBIDDEN"
direct_database_or_jsonl_write = "FORBIDDEN"
partial_success = "FORBIDDEN"
failure_policy = "Run retained inverse br commands in reverse order, verify the pre-run semantic root, and refuse a green terminal if restoration is incomplete."
read_only_modes_must_preserve = [
  "live Beads semantic root",
  "live issue membership",
  "live issue fields",
  "live dependency graph",
  "live export state",
]

[logging]
format = "JSONL"
encoding = "UTF-8"
schema = "frankensim.beads-template-hygiene-event.v1"
deterministic = true
redacted = true
sequence = "dense unsigned integers starting at zero"
stable_event_order = "case ordinal, attempt, stage ordinal, issue ID byte order, warning class byte order"
required_fields = [
  "schema",
  "tool",
  "rule",
  "source",
  "run",
  "case",
  "attempt",
  "stage",
  "sequence",
  "issue",
  "warning",
  "disposition",
  "shard",
  "old_semantic_root",
  "new_semantic_root",
  "command",
  "result",
  "first_divergence",
  "caps",
  "terminal",
  "inverse_br_command",
  "safe_relative_artifacts",
  "reproduction",
]
field_presence_policy = "Every event carries every required field. Stage-inapplicable payload fields are explicit nulls; omitted required fields refuse replay."
nullable_until_applicable = [
  "issue",
  "warning",
  "disposition",
  "shard",
  "old_semantic_root",
  "new_semantic_root",
  "command",
  "result",
  "first_divergence",
  "terminal",
  "inverse_br_command",
  "reproduction",
]
command_representation = "argv array, never a shell-expanded string"
terminal_event_required = true
terminal_event_must_be_last = true
terminal_event_binds = [
  "source identities",
  "manifest identity",
  "case order",
  "event sequence",
  "inventory root",
  "plan root",
  "before and after semantic roots",
  "artifact paths",
  "exit code",
]
forbidden_fields = [
  "secret",
  "token",
  "credential",
  "environment value",
  "absolute path",
  "process ID",
  "thread ID",
  "scheduler timing",
  "wall-clock timestamp",
  "bulk issue description",
]
truncation_policy = "REFUSE_GREEN_AND_REPORT_FIRST_DIVERGENCE"

[artifact_contract]
output_root = "artifacts/beads-template-hygiene"
paths_are_relative = true
overwrite_existing_run = false
artifact_union = [
  "source.json",
  "inventory.json",
  "partitions.json",
  "plan.json",
  "events.jsonl",
  "terminal.json",
  "reproduce.txt",
]
case_expected_artifacts_are_controlling = true
publication_order = "Write all non-terminal artifacts, write the complete events.jsonl whose unique terminal event is its last row, then write terminal.json as the final run seal. A green consumer requires exact complete artifact membership plus both agreeing terminals; any interrupted prefix refuses."
terminal_seal_rule = "terminal.json binds the ordered identities of every other artifact and the pre-terminal event prefix. It does not contain or bind its own byte identity; the terminal artifact identity is computed externally after publication, avoiding a circular self-hash."
apply_only_artifacts = [
  "apply-manifest.json",
  "inverse-br.json",
  "restoration.json",
]
artifact_order = "UTF-8 bytewise relative path"
artifact_identity = "semantic root over schema, length, relative path, and canonical bytes"
absolute_paths = "REFUSE"
symlinks = "REFUSE"
path_traversal = "REFUSE"
empty_or_dot_component = "REFUSE_BEFORE_NORMALIZATION"
backslash_or_drive_prefix = "REFUSE"
tilde_prefix = "REFUSE"
control_or_nul_character = "REFUSE"
unicode_normalization = "Require NFC and compare the original spelling before constructing a path object."
max_path_depth = 32
max_component_bytes = 128
existing_output_target = "REFUSE, including byte-identical content; restart uses a new explicit disjoint run directory."
parent_symlink_race_policy = "Open each parent without following symlinks immediately before publication; any identity change refuses."

[replay_contract]
artifact_only = true
cli_scope = "--replay REL is artifact-only and can never execute an inverse br command. Inverse replay is a mutation fixture exercised by --self-test after an explicitly isolated apply."
live_tracker_reads = "FORBIDDEN"
live_tracker_writes = "FORBIDDEN"
network_access = "FORBIDDEN"
output_root = "caller-supplied disjoint relative directory"
overwrite = "FORBIDDEN"
required_reconstruction = [
  "source identity projection",
  "exact warning-row membership",
  "all overlap partitions and derived counts",
  "joined issue semantic projection",
  "disposition set and rationale identities",
  "bounded shard membership and order",
  "inventory root",
  "plan root",
  "terminal projection",
]
equivalence = "byte-identical canonical semantic projection and roots"
first_divergence_required = true
inverse_plan_required_for_mutating_runs = true
replay_mints_authority = false
no_claim = "Artifact-only replay demonstrates deterministic reconstruction of the retained run projection. It does not authenticate the producer, validate owner judgments, prove the lint taxonomy complete, or show that the current live tracker still matches."

[[case]]
ordinal = 1
id = "template-lint.inventory-empty"
role = "boundary"
mode = "--inventory"
fixture = "inventory-empty"
perturbation = "none"
expected_terminal = "Pass"
expected_exit = 0
expected_subject_terminal = "PASS"
mutation = "none"
replay = "none"
expected_inner_br_category = "READ_SUCCESS"
expected_event_stages = ["start", "source", "inventory", "partition", "publish", "terminal"]
expected_artifacts = ["source.json", "inventory.json", "partitions.json", "events.jsonl", "terminal.json", "reproduce.txt"]
expected_live_target_mutation = false
expected_fixture_mutation = false
inverse_required = false
mutation_expectation = "No target or fixture mutation; emit exact empty warning sets, partitions, and zero derived counts."
authority = "INVENTORY_ONLY"
no_claim = "An empty fixture proves empty-set handling only; it does not prove the live repository has zero debt."
assertions = [
  "Every warning-class membership and overlap partition is the empty set.",
  "All derived counts are zero and the inventory root is deterministic.",
  "The terminal log is present even when there are no issue rows.",
]

[[case]]
ordinal = 2
id = "template-lint.inventory-live"
role = "positive"
mode = "--inventory"
fixture = "inventory-live"
perturbation = "permute lint result rows and JSON object-field order while retaining exact semantic membership"
expected_terminal = "Pass"
expected_exit = 0
expected_subject_terminal = "PASS"
mutation = "none"
replay = "none"
expected_inner_br_category = "READ_SUCCESS"
expected_event_stages = ["start", "source", "inventory", "join", "partition", "publish", "terminal"]
expected_artifacts = ["source.json", "inventory.json", "partitions.json", "events.jsonl", "terminal.json", "reproduce.txt"]
expected_live_target_mutation = false
expected_fixture_mutation = false
inverse_required = false
mutation_expectation = "Read-only exact-set capture; no warning count or membership is changed."
authority = "INVENTORY_ONLY"
no_claim = "Capturing a live-shaped fixture records its rows but does not approve any repair or classify owner intent automatically."
assertions = [
  "All warning rows are joined to status, priority, type, owner, parent, dependencies, obligations, authority, and no-claim fields.",
  "Input object and field order do not affect canonical row order or the inventory root.",
  "Unknown, duplicate, or malformed rows refuse instead of being dropped.",
]

[[case]]
ordinal = 3
id = "template-lint.overlap-partitions"
role = "boundary"
mode = "--inventory"
fixture = "overlap-partitions"
perturbation = "cover every exclusive A, S, and C overlap partition, then inject one hidden duplicate in the negative twin"
expected_terminal = "Pass"
expected_exit = 0
expected_subject_terminal = "PASS"
mutation = "none"
replay = "none"
expected_inner_br_category = "READ_SUCCESS"
expected_event_stages = ["start", "source", "inventory", "join", "partition", "publish", "terminal"]
expected_artifacts = ["source.json", "inventory.json", "partitions.json", "events.jsonl", "terminal.json", "reproduce.txt"]
expected_live_target_mutation = false
expected_fixture_mutation = false
inverse_required = false
mutation_expectation = "Read-only set arithmetic; no overlapping issue is duplicated into an apply plan."
