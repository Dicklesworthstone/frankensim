# Foundations P0-P6 retained-evidence revalidation manifest
# (bead frankensim-epic-foundations-huq.25).
#
# Enumerates the historical Foundations milestone evidence exactly as
# retained: each row binds its bead's close-reason bytes by sha256 (lossless;
# the beads DB stays the sole clause authority) and declares what remains
# mechanically replayable at the current revision. The DRIVER classifies
# rows at run time (Current / Stale / Refuted / Blocked / Unsupported /
# NoData / HistoricalOnly); this manifest never bakes in a verdict, and a
# row with no replay command can never be classified Current - proof is
# never inferred from a closure date or an aggregate pass count.
#
# evidence_grade is a MANIFEST-TIME statement about what the retained close
# reason cites, reviewed by hand against the beads DB on 2026-08-14:
#   executable   the close reason names tests/artifacts that exist at HEAD
#                and a replay command below exercises them
#   prose        the close reason describes delivered work but names no
#                executable root the driver can replay
#   none         the close reason carries no evidence content at all
schema = "frankensim.foundations.p0p6-revalidation-manifest.v1"

